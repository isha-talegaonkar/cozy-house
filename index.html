<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Cozy House</title>
<link rel="stylesheet" href="styles.css">
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.164.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/" } }</script>
</head>
<body>
<div id="ui">
<div id="hud" class="panel"><div class="title">🍂 The Cozy House</div><div id="clock"></div><div id="seasons" class="seg"></div></div>
<div id="status" class="panel"></div>
<div id="controls" class="panel">
  <button id="rotL" title="Rotate view">⟲</button>
  <button id="rotR" title="Rotate view">⟳</button>
  <button id="zoomOut" title="Zoom out">−</button>
  <button id="zoomIn" title="Zoom in">+</button>
  <button id="home" title="Recenter">⌂</button>
  <button id="speed">Speed 1×</button>
  <button id="music">♪<span class="txt"> Music: off</span></button>
</div>
<div id="menu"></div>
<div id="note" class="panel">Drag to move around · scroll wheel or pinch to zoom · two-finger swipe to pan</div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
