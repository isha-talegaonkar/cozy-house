<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------- renderer / camera
const renderer = new THREE.WebGLRenderer({ antialias: true });

document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 140);
let camAz = Math.PI / 4, camAzTarget = camAz;
const CAM_EL = .62, CAM_D = 45;
camera.zoom = 1.3;
function resize() {
  const w = innerWidth, h = innerHeight, a = w / h, v = 8.2;
  renderer.setSize(w, h);
  camera.left = -v * a; camera.right = v * a; camera.top = v; camera.bottom = -v; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
// ---- pan (drag / arrow keys) + zoom (scroll / pinch / buttons)
const camTarget = new THREE.Vector3(0, .3, 0);
const zoomBy = f => { camera.zoom = Math.min(3, Math.max(.5, camera.zoom * f)); camera.updateProjectionMatrix(); };
function panBy(dxPx, dyPx) {
  const k = (camera.top - camera.bottom) / camera.zoom / innerHeight;
  const right = new THREE.Vector3(Math.cos(camAz), 0, -Math.sin(camAz)), away = new THREE.Vector3(-Math.sin(camAz), 0, -Math.cos(camAz));
  camTarget.addScaledVector(right, -dxPx * k).addScaledVector(away, dyPx * k / Math.sin(CAM_EL));
  camTarget.x = Math.max(-14, Math.min(14, camTarget.x)); camTarget.z = Math.max(-14, Math.min(14, camTarget.z));
}
const cv = renderer.domElement, pointers = new Map();
cv.style.cursor = 'grab'; cv.style.touchAction = 'none';
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); cv.style.cursor = 'grabbing'; });
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const [px, py] = pointers.get(e.pointerId);
  if (pointers.size === 1) panBy(e.clientX - px, e.clientY - py);
  else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()], other = a === pointers.get(e.pointerId) ? b : a;
    const before = Math.hypot(px - other[0], py - other[1]), after = Math.hypot(e.clientX - other[0], e.clientY - other[1]);
    if (before > 0) zoomBy(after / before);
  }
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
});
const endPointer = e => { pointers.delete(e.pointerId); if (!pointers.size) cv.style.cursor = 'grab'; };
cv.addEventListener('pointerup', endPointer); cv.addEventListener('pointercancel', endPointer);
// zoom the house (never the browser page) on scroll or trackpad pinch (ctrlKey) anywhere on the page
addEventListener('wheel', e => { e.preventDefault(); zoomBy(Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0015))); }, { passive: false });
['gesturestart', 'gesturechange'].forEach(t => addEventListener(t, e => e.preventDefault()));
// if the browser is zoomed anyway, keep the panels pinned to the visible corners
const vv = window.visualViewport;
if (vv) { const pinUI = () => { document.getElementById('ui').style.transform = `translate(${vv.offsetLeft}px, ${vv.offsetTop}px) scale(${1 / vv.scale})`; }; vv.addEventListener('resize', pinUI); vv.addEventListener('scroll', pinUI); pinUI(); }
const keys = new Set();
addEventListener('keydown', e => { keys.add(e.key.toLowerCase()); if (e.key === '+' || e.key === '=') zoomBy(1.15); if (e.key === '-') zoomBy(1 / 1.15); });
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
function keyPan(dt) {
  const v = 500 * dt, k = n => keys.has(n);
  panBy((k('arrowleft') || k('a') ? v : 0) - (k('arrowright') || k('d') ? v : 0), (k('arrowup') || k('w') ? v : 0) - (k('arrowdown') || k('s') ? v : 0));
}

// ---------------------------------------------------------------- helpers
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .85, flatShading: true, ...o });
function add(geo, mat, x, y, z, parent = scene) {
  const m = new THREE.Mesh(geo, typeof mat === 'string' ? M(mat) : mat);
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
const B = (w, h, d, mat, x, y, z, parent) => add(new THREE.BoxGeometry(w, h, d), mat, x, y, z, parent);
const C = (rt, rb, h, seg, mat, x, y, z, parent) => add(new THREE.CylinderGeometry(rt, rb, h, seg), mat, x, y, z, parent);
const Sph = (r, mat, x, y, z, parent, seg = 10) => add(new THREE.SphereGeometry(r, seg, Math.max(6, seg - 2)), mat, x, y, z, parent);
function group(x, y, z, ry = 0, parent = scene) { const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; parent.add(g); return g; }
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  t.userData.canvas = c; return t;
}
const lerpAngle = (a, b, k) => { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * k; };

// ---------------------------------------------------------------- materials
const wood = M('#8a5634'), darkWood = M('#5e371f'), lightWood = M('#b98a5e');
const stone = M('#8f857c'), wallMat = M('#ecdcc0'), frameMat = M('#5a3624');
const terracotta = M('#c2683f'), creamPot = M('#efe2c8'), sagePot = M('#8fa07a');
const leafG = [M('#4f7a43'), M('#3f6a3a'), M('#5f8a4a'), M('#6f9a52')];
const glassMat = new THREE.MeshStandardMaterial({ color: '#cfe3ef', transparent: true, opacity: .22, roughness: .1, depthWrite: false, side: THREE.DoubleSide });

// ---------------------------------------------------------------- floors
function planks(c1, c2, c3, line) {
  return canvasTex(256, 256, (g) => {
    const cols = [c1, c2, c3];
    for (let r = 0; r < 8; r++) for (let s = -1; s < 3; s++) {
      g.fillStyle = cols[(r * 2 + s + 3) % 3]; g.fillRect(s * 128 + (r % 2) * 64, r * 32, 128, 32);
      g.fillStyle = line; g.fillRect(s * 128 + (r % 2) * 64, r * 32, 2, 32);
    }
    g.fillStyle = line; for (let r = 0; r < 8; r++) g.fillRect(0, r * 32, 256, 2);
  }, [2, 1.5]);
}
const floors = {
  L: planks('#9a6440', '#8f5c3a', '#a06a45', '#6a3d22'),
  S: planks('#c9a27a', '#bf9870', '#d1ab84', '#9a7450'),
  K: canvasTex(64, 64, g => { for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { g.fillStyle = (i + j) % 2 ? '#c46a4a' : '#efe2c8'; g.fillRect(i * 16, j * 16, 16, 16); } }, [5, 3.5]),
  B: canvasTex(128, 128, g => { g.fillStyle = '#c49a94'; g.fillRect(0, 0, 128, 128); for (let i = 0; i < 1400; i++) { g.fillStyle = Math.random() < .5 ? '#b98c86' : '#cfa8a2'; g.fillRect(Math.random() * 128, Math.random() * 128, 2, 2); } }, [2, 2]),
};
for (const t of Object.values(floors)) t.magFilter = THREE.NearestFilter;
floors.K.magFilter = THREE.NearestFilter;
B(10.4, .4, 7.4, stone, 0, -.25, 0);
[['B', -2.5, -1.75], ['L', -2.5, 1.75], ['K', 2.5, -1.75], ['S', 2.5, 1.75]].forEach(([k, x, z]) =>
  B(5, .1, 3.5, M('#ffffff', { map: floors[k], flatShading: false }), x, -.04, z));

// ---------------------------------------------------------------- walls (tall + cutaway versions)
const WALL_H = 2.6, LOW_H = .5, WT = .15;
function buildWall(ax, az, bx, bz, h, openings, decorate) {
  const g = new THREE.Group(), dx = bx - ax, dz = bz - az, L = Math.hypot(dx, dz);
  g.position.set(ax, 0, az); g.rotation.y = Math.atan2(-dz, dx); scene.add(g);
  const piece = (x0, x1, y0, y1) => { if (x1 - x0 > .001 && y1 - y0 > .001) B(x1 - x0, y1 - y0, WT, wallMat, (x0 + x1) / 2, (y0 + y1) / 2, 0, g); };
  let cur = 0;
  for (const o of [...openings].sort((a, b) => a.s - b.s)) {
    piece(cur, o.s, 0, h); piece(o.s, o.s + o.w, 0, Math.min(o.y0, h)); if (o.y1 < h) piece(o.s, o.s + o.w, o.y1, h);
    if (h > 1 && o.y0 > 0) {   // window frame + glass
      const cx = o.s + o.w / 2, cy = (o.y0 + o.y1) / 2, hh = o.y1 - o.y0;
      B(o.w + .12, .07, WT + .1, frameMat, cx, o.y0, 0, g); B(o.w + .12, .07, WT + .06, frameMat, cx, o.y1, 0, g);
      B(.07, hh, WT + .06, frameMat, o.s, cy, 0, g); B(.07, hh, WT + .06, frameMat, o.s + o.w, cy, 0, g);
      B(.04, hh, WT + .02, frameMat, cx, cy, 0, g); B(o.w, .04, WT + .02, frameMat, cx, cy, 0, g);
      add(new THREE.PlaneGeometry(o.w, hh), glassMat, cx, cy, 0, g).castShadow = false;
    }
    cur = o.s + o.w;
  }
  piece(cur, L, 0, h);
  if (decorate) decorate(g);
  return g;
}
const win = (s, w = 1.2) => ({ s, w, y0: 1.0, y1: 2.15 });
const door = (s, w = .8) => ({ s, w, y0: 0, y1: 2.15 });
// in each wall's local frame: x runs along the wall, +z is inside (sign given)
const EXT = [
  { n: [0, -1], a: [-5.075, -3.5], b: [5.075, -3.5], inside: 1, open: [win(1.975), win(8.075)] },  // north: bedroom + kitchen windows
  { n: [0, 1], a: [-5.075, 3.5], b: [5.075, 3.5], inside: -1, open: [win(1.175), door(3.675), win(7.675)] }, // south: living window, front door, studio window
  { n: [-1, 0], a: [-5, -3.575], b: [-5, 3.575], inside: -1, open: [win(1.375, 1.0)] },              // west: bedroom window
  { n: [1, 0], a: [5, -3.575], b: [5, 3.575], inside: 1, open: [win(1.575, 1.0), win(5.175, .8)] },  // east: kitchen + studio windows
];
const sillPlant = (g, s, inside, kind) => { const p = plant(kind, 0, 0, .8, g); p.position.set(s, 1.04, inside * .12); };
const wallDecor = [
  g => { // north: shelf + trailing pothos + herbs on kitchen sill, frame above bed side
    B(3.0, .05, .28, darkWood, 7.05, 1.9, .2, g);
    [['#c9a36b', .2], ['#8e3b2f', .15], ['#e6c48a', .17]].forEach(([c, h], i) => C(.07, .07, h, 8, c, 5.9 + i * .45, 1.93 + h / 2, .2, g));
    const p1 = plant('pothos', 0, 0, .8, g); p1.position.set(7.8, 1.93, .2);
    const p2 = plant('pothos', 0, 0, .7, g); p2.position.set(8.4, 1.93, .2);
    sillPlant(g, 8.4, 1, 'small'); sillPlant(g, 2.3, 1, 'succulent'); sillPlant(g, 3.0, 1, 'small');
    B(.5, .6, .04, frameMat, .9, 1.7, .08, g); B(.42, .52, .02, M('#e6b77a'), .9, 1.7, .1, g); Sph(.12, M('#c9763f'), .9, 1.68, .11, g).scale.z = .2;
  },
  g => { sillPlant(g, 1.5, -1, 'succulent'); sillPlant(g, 1.95, -1, 'small'); sillPlant(g, 8.1, -1, 'small'); },
  g => { // west: chimney breast, mantel art, hanging planter, bedroom sill
    B(1.2, 1.4, .4, stone, 5.325, 1.9, -.25, g);
    B(.6, .45, .04, frameMat, 5.325, 1.95, -.47, g); B(.52, .37, .02, M('#d98a5a'), 5.325, 1.95, -.49, g);
    sillPlant(g, 1.7, -1, 'small'); sillPlant(g, 2.1, -1, 'succulent');
    B(.04, .04, .35, darkWood, 3.0, 2.25, -.2, g); add(new THREE.CylinderGeometry(.003, .003, .4), M('#3a2418'), 3.0, 2.05, -.37, g);
    const hp = plant('pothos', 0, 0, .75, g); hp.position.set(3.0, 1.75, -.37);
  },
  g => { // east: kitchen + studio sills, pin board
    sillPlant(g, 2.07, 1, 'small'); sillPlant(g, 5.55, 1, 'succulent');
    B(.9, .6, .04, M('#b98a5e'), 4.1, 1.75, .09, g);
    ['#f6efe2', '#e6c48a', '#c9763f', '#8fa07a'].forEach((c, i) => B(.22, .26, .01, M(c), 3.8 + (i % 2) * .38, 1.62 + Math.floor(i / 2) * .28, .12, g));
  },
];
const walls = EXT.map((w, i) => ({
  n: w.n,
  tall: buildWall(...w.a, ...w.b, WALL_H, w.open, wallDecor[i]),
  low: buildWall(...w.a, ...w.b, LOW_H, w.open),
}));
// interior walls are always cut away (Sims-style)
buildWall(0, -3.5, 0, 3.5, LOW_H, [door(5.9)]);
buildWall(-5, 0, 5, 0, LOW_H, [door(3.8), door(7.6)]);

// ---------------------------------------------------------------- plants
function plant(kind, x, z, s = 1, parent = scene, y = 0) {
  const g = group(x, y, z, rand(0, 6), parent); g.scale.setScalar(s);
  const pot = pick([terracotta, creamPot, sagePot]);
  const lm = () => pick(leafG);
  if (kind === 'monstera') {
    C(.2, .15, .32, 10, pot, 0, .16, 0, g);
    for (let i = 0; i < 7; i++) {
      const a = i / 7 * Math.PI * 2, h = .5 + (i % 3) * .18, L = new THREE.Group(); L.position.set(0, .3, 0); L.rotation.y = a; g.add(L);
      add(new THREE.CylinderGeometry(.01, .01, h), '#4a6a3a', 0, h / 2, .05, L).rotation.x = .3;
      const leaf = Sph(.2, lm(), 0, h, .22, L, 8); leaf.scale.set(1, .12, 1.2); leaf.rotation.x = .35;
    }

    C(.14, .12, .28, 8, pot, 0, .14, 0, g);
    for (let i = 0; i < 6; i++) { const b = B(.07, rand(.5, .8), .02, i % 2 ? '#3f6a3a' : '#5a7a3a', rand(-.06, .06), .55, rand(-.06, .06), g); b.rotation.set(rand(-.15, .15), rand(0, 3), rand(-.15, .15)); }
  } else if (kind === 'fern') {
    C(.18, .14, .26, 10, pot, 0, .13, 0, g);
    for (let i = 0; i < 10; i++) { const L = group(0, .28, 0, i / 10 * Math.PI * 2, g); const f = B(.08, .02, .45, lm(), 0, .1, .2, L); f.rotation.x = -.5 + (i % 2) * .25; }
  } else if (kind === 'fiddle') {
    C(.18, .14, .34, 10, pot, 0, .17, 0, g);
    C(.025, .03, 1.3, 6, '#5a3d28', 0, .95, 0, g);
    for (let i = 0; i < 9; i++) { const l = Sph(.13, lm(), Math.cos(i * 2.4) * .14, .8 + i * .1, Math.sin(i * 2.4) * .14, g, 8); l.scale.set(1, .5, 1.3); l.rotation.set(rand(-.4, .4), i * 2.4, 0); }
  } else if (kind === 'pothos') {
    C(.1, .08, .14, 8, pot, 0, .07, 0, g);
    Sph(.12, lm(), 0, .17, 0, g, 8).scale.y = .6;
    for (let v = 0; v < 4; v++) { const a = v / 4 * Math.PI * 2 + .4; for (let k = 0; k < 6; k++) Sph(.045, lm(), Math.cos(a) * (.12 + k * .012), .1 - k * .1, Math.sin(a) * (.12 + k * .012), g, 6); }

    C(.07, .06, .08, 8, pot, 0, .04, 0, g);
    for (let i = 0; i < 6; i++) { const c = add(new THREE.ConeGeometry(.03, .1, 5), '#8fae7a', Math.cos(i) * .03, .12, Math.sin(i) * .03, g); c.rotation.set(Math.cos(i) * .5, 0, Math.sin(i) * .5); }
  } else { // small leafy
    C(.1, .08, .14, 8, pot, 0, .07, 0, g);
    add(new THREE.IcosahedronGeometry(.13, 0), lm(), 0, .22, 0, g); add(new THREE.IcosahedronGeometry(.09, 0), lm(), .07, .3, .03, g);
  }
  return g;
}

const shades = [];
const lights = [];

// --- living room: fireplace, rug, sofa, armchair, bookshelf, lamp
B(.25, 1.3, 1.6, stone, -4.83, .65, 1.75);
B(.45, 1.3, .38, stone, -4.6, .65, 1.11); B(.45, 1.3, .38, stone, -4.6, .65, 2.39);

B(.8, .06, 1.9, M('#6a625b'), -4.5, .03, 1.75);
B(.75, .1, 1.95, wood, -4.55, 1.35, 1.75);
const fire = group(-4.5, .06, 1.75);
[-.4, .4].forEach(r => { const l = C(.05, .05, .5, 6, '#4a2e1e', 0, .05, 0, fire); l.rotation.set(Math.PI / 2, r, 0); });
const flames = [['#c2401f', .16, .45], ['#f07b2a', .12, .34], ['#ffd05a', .07, .22]].flatMap(([c, r, h], k) =>
  [-.12, 0, .12].map(dz => { const f = add(new THREE.ConeGeometry(r, h, 6), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: .9 }), .02 * k, .1 + h / 2, dz, fire); f.castShadow = false; f.userData = { h, k: k * 3 + dz * 10 }; return f; }));
const fireLight = new THREE.PointLight('#ff8a3d', 6, 0, 1.6); fireLight.position.set(-4.0, .7, 1.75); scene.add(fireLight);
const candleFlames = [1.2, 1.4].map(z => { C(.035, .035, .2, 8, '#efe2c4', -4.5, 1.5, z); const f = Sph(.028, new THREE.MeshBasicMaterial({ color: '#ffcf6b' }), -4.5, 1.63, z, scene, 6); f.castShadow = false; return f; });
plant('small', -4.5, 0, 1, scene, 1.4).position.z = 2.3;

const rug = C(1.1, 1.1, .02, 32, '#8e3b2f', -3.25, .01, 1.75); rug.scale.z = .8;
C(.9, .9, .025, 32, '#c46a4a', -3.25, .01, 1.75).scale.z = .8;

  if (walking) { swing = Math.sin(c.walkPhase) * .6; bodyY += Math.abs(Math.sin(c.walkPhase)) * .012; tailRX = -1.0; }
  if (c.mode === 'playing' && play.phase === 1) { hop = Math.max(0, Math.sin(T * 5 + (c === play.cats[0] ? 0 : Math.PI))) * .22; bodyRX = -hop; tailRZ = Math.sin(T * 9) * .6; }
  if (c.mode === 'act') {
    if (c.act === 'nap') { legS = .01; bodyY = .1; ts = [.95, .72 + Math.sin(T * 1.1) * .02, 1.25]; headY = .02; headRX = .5; tailRX = -1.55; tailRZ = 1.3; }
    if (c.act === 'eat') { headRX = .75 + Math.sin(T * 7) * .08; bodyRX = .15; }
    if (c.act === 'groom' || c.act === 'beg') { bodyRX = -.55; bodyY = .23; tailRX = -1.5; headRX = c.act === 'groom' ? (Math.sin(T * 4) > .2 ? .55 : .1) : -.25 + Math.sin(T * 2) * .1; }
  }
  r.body.position.y = bodyY + hop; r.body.rotation.x = bodyRX;
  r.torso.scale.set(...ts); r.head.position.y = headY; r.head.rotation.x = headRX;
  r.tail.rotation.set(tailRX, 0, tailRZ);
  r.legs.forEach((l, i) => { l.scale.y = legS; l.rotation.x = (i === 0 || i === 3 ? swing : -swing); });
  r.root.position.set(c.x, c.y, c.z); r.root.rotation.y = c.heading;
}

function updatePlay(dt) {
  if (!play) return;
  const [a, b] = play.cats;
  if (!play.start) { if (a.mode === 'playWait' && b.mode === 'playWait') { play.start = simT; a.mode = b.mode = 'playing'; a.bubbleT = b.bubbleT = 0; } return; }
  const e = simT - play.start; play.phase = Math.floor(e / 4) % 2;
  if (play.phase === 0) {
    const ang = e * 1.3;
    [[a, ang], [b, ang - 1.0]].forEach(([c, t]) => { c.x = PLAY.x + Math.cos(t) * .5; c.z = PLAY.z + Math.sin(t) * .4; c.heading = Math.atan2(-Math.sin(t) * .5, Math.cos(t) * .4); c.walkPhase += dt * 14; });
    yarn.position.set(PLAY.x + Math.cos(ang + .5) * .5, .08, PLAY.z + Math.sin(ang + .5) * .4); yarn.rotation.x += dt * 6;
  } else {
    a.heading = Math.atan2(b.x - a.x, b.z - a.z); b.heading = Math.atan2(a.x - b.x, a.z - b.z);
  }
  if (e > 20) { play = null; [a, b].forEach(c => { c.mode = 'idle'; c.last = 'play'; }); yarn.position.set(PLAY.x, .08, PLAY.z); }
}
const CAT_ICON = { nap: '💤', eat: '🐟', groom: '✨', beg: '❤️' };
const CAT_LABEL = { nap: 'napping', eat: 'eating', groom: 'grooming', beg: 'begging for a treat', idle: 'exploring' };

function updateBubble(a, isCat, dt) {
  a.bubbleT += dt;
  let icon = null;
  if (isCat) icon = a.mode === 'playing' ? '🧶' : a.mode === 'act' ? CAT_ICON[a.act] : null;
  else icon = a.mode === 'act' ? SPOTS[a.spot].icon : null;
  const show = icon && (a.bubbleT % 18) < 5;
  a.bubble.visible = !!show;
  if (show) {
    a.bubble.material = bubbleMat(icon);
    const hp = new THREE.Vector3(); (isCat ? a.rig.head : a.rig.head).getWorldPosition(hp);
    a.bubble.position.set(hp.x, hp.y + (isCat ? .4 : .55) + Math.sin(simT * 1.5 + a.ph) * .04, hp.z);
    const k = Math.min(1, (a.bubbleT % 18) * 3, (5 - a.bubbleT % 18) * 3); a.bubble.scale.setScalar((isCat ? .42 : .55) * Math.max(.01, k));
  }
}

// ---------------------------------------------------------------- lighting + day cycle
const hemi = new THREE.HemisphereLight('#c8d0e8', '#5a4030', .8); scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffd9a8', 2.4);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0005;
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 80 });
scene.add(sun, sun.target);
const KEYS = [
  [0, '#151a33', '#6f86c8', .2, .3, 1], [5.5, '#1c2340', '#6f86c8', .2, .32, 1], [7, '#f2b38a', '#ffb37a', 1.4, .6, .5],
  [10, '#b9cfd9', '#fff0d8', 2.6, .9, 0], [15.5, '#d9c9b0', '#ffd9a8', 2.4, .85, 0], [17.5, '#f0a070', '#ff9a5a', 1.8, .65, .6],
  [19, '#6a4a6a', '#ff7a5a', .6, .4, 1], [20.5, '#1f2140', '#6f86c8', .22, .3, 1], [24, '#151a33', '#6f86c8', .2, .3, 1]];
const cA = new THREE.Color(), cB = new THREE.Color();
let lampLevel = 0;
function updateDay() {
  let i = 0; while (KEYS[i + 1][0] <= hour) i++;
  const [h0, s0, u0, si0, hi0, l0] = KEYS[i], [h1, s1, u1, si1, hi1, l1] = KEYS[i + 1], k = (hour - h0) / (h1 - h0);
  const sky = cA.set(s0).lerp(cB.set(s1), k);
  scene.background = sky.clone(); scene.fog.color.copy(sky);
  sun.color.set(u0).lerp(cB.set(u1), k); sun.intensity = si0 + (si1 - si0) * k;
  hemi.intensity = hi0 + (hi1 - hi0) * k; hemi.color.copy(sky).lerp(cB.set('#ffffff'), .5);
  lampLevel = l0 + (l1 - l0) * k;
  let dir;
  if (hour > 6 && hour < 19.5) { const a = (hour - 6) / 13.5 * Math.PI; dir = new THREE.Vector3(Math.cos(a), Math.sin(a) * .9 + .12, .55); }
  else dir = new THREE.Vector3(-.4, .9, .5);
  sun.position.copy(dir.normalize().multiplyScalar(40));
  lights.forEach(l => l.intensity = l.userData.base * lampLevel);
  shades.forEach(m => m.emissiveIntensity = lampLevel * .9);
  postMat.emissiveIntensity = lampLevel * 1.5;
  const hh = Math.floor(hour), mm = Math.floor((hour % 1) * 60);
  document.getElementById('clock').textContent = `${(hh % 12) || 12}:${String(mm).padStart(2, '0')} ${hh < 12 ? 'am' : 'pm'} · Fall · ${night() ? 'night' : hour < 12 ? 'morning' : hour < 17 ? 'afternoon' : 'evening'}`;
}

// ---------------------------------------------------------------- music (generated in the browser, no files)
let audio = null, musicOn = false;
function makeAudio() {
  const ctx = new AudioContext(), master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
  const conv = ctx.createConvolver(), len = ctx.sampleRate * 3.5, ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5); }
  conv.buffer = ir;
  const wet = ctx.createGain(); wet.gain.value = .55; conv.connect(wet).connect(master);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800; lp.connect(master); lp.connect(conv);
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const pad = (m, t, d) => {
    [0, 6].forEach(det => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = mtof(m); o.detune.value = det;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.022, t + 2); g.gain.linearRampToValueAtTime(0, t + d); o.connect(g).connect(lp); o.start(t); o.stop(t + d + .1); });
  };
  const pluck = (m, t) => {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = mtof(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.07, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + 2.5);
    o.connect(g).connect(lp); o.start(t); o.stop(t + 2.6);
  };
  const chords = [[48, 55, 64, 71], [45, 52, 60, 67], [41, 48, 57, 64], [43, 50, 59, 62]];
  const scale = [60, 62, 64, 67, 69, 72, 74, 76, 79];
  let next = ctx.currentTime + .2, ci = 0;
  setInterval(() => {
    while (next < ctx.currentTime + 1.5) {
      const ch = chords[ci++ % chords.length];
      ch.forEach(m => pad(m, next, 8.5));
      for (let b = 0; b < 8; b++) if (Math.random() < .42) pluck(Math.random() < .5 ? pick(ch) + 12 : pick(scale), next + b + rand(0, .08));
      next += 8;
    }
  }, 300);
  // fire crackle loop
  const cl = ctx.sampleRate * 6, cb = ctx.createBuffer(1, cl, ctx.sampleRate), cd = cb.getChannelData(0);
  let brown = 0;
  for (let i = 0; i < cl; i++) { brown = (brown + (Math.random() * 2 - 1) * .02) * .995; cd[i] = brown * .6; }
  for (let k = 0; k < 140; k++) { const s = Math.floor(Math.random() * (cl - 400)), amp = rand(.1, .6); for (let i = 0; i < 300; i++) cd[s + i] += (Math.random() * 2 - 1) * amp * Math.exp(-i / 40); }
  const src = ctx.createBufferSource(); src.buffer = cb; src.loop = true;
  const cg = ctx.createGain(); cg.gain.value = .25; const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 300;
  src.connect(hp).connect(cg).connect(master); src.start();
  return { ctx, master };
}
document.getElementById('music').onclick = e => {
  if (!audio) audio = makeAudio();
  musicOn = !musicOn;
  const { ctx, master } = audio; ctx.resume();
  master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
  master.gain.linearRampToValueAtTime(musicOn ? .7 : 0, ctx.currentTime + 2);
  e.target.textContent = musicOn ? '♪ Music: on' : '♪ Music: off';
};
document.getElementById('zoomIn').onclick = () => zoomBy(1.25);
document.getElementById('zoomOut').onclick = () => zoomBy(1 / 1.25);
document.getElementById('home').onclick = () => { camTarget.set(0, .3, 0); camera.zoom = 1.3; camera.updateProjectionMatrix(); };
document.getElementById('rotL').onclick = () => camAzTarget -= Math.PI / 2;
document.getElementById('rotR').onclick = () => camAzTarget += Math.PI / 2;
document.getElementById('speed').textContent = `Speed ${speed}×`;
document.getElementById('speed').onclick = e => { speed = speed === 1 ? 5 : speed === 5 ? 20 : 1; e.target.textContent = `Speed ${speed}×`; };

// ---------------------------------------------------------------- main loop
const clock = new THREE.Clock();
let lastStatus = '';
function frame() {
  const dt = Math.min(.05, clock.getDelta()), T = clock.elapsedTime, sdt = dt * speed;
  simT += sdt; hour = (hour + sdt / 20) % 24;

  camAz += (camAzTarget - camAz) * Math.min(1, dt * 4);
  const cd = new THREE.Vector3(Math.sin(camAz) * Math.cos(CAM_EL), Math.sin(CAM_EL), Math.cos(camAz) * Math.cos(CAM_EL));
  keyPan(dt);
  camera.position.copy(cd).multiplyScalar(CAM_D).add(camTarget); camera.lookAt(camTarget);
  walls.forEach(w => { const low = w.n[0] * Math.sin(camAz) + w.n[1] * Math.cos(camAz) > .1; w.tall.visible = !low; w.low.visible = low; });
  trees.forEach(t => {
    const front = t.x * Math.sin(camAz) + t.z * Math.cos(camAz), d = Math.hypot(t.x, t.z);
    t.op += ((front > 3 && d < 14 ? .18 : 1) - t.op) * Math.min(1, dt * 4);
    t.mats.forEach(m => { m.opacity = t.op; m.depthWrite = t.op > .9; });
  });

  updateDay();
  const flick = 1 + Math.sin(T * 11) * .1 + Math.sin(T * 5.3) * .08 + (Math.random() - .5) * .06;
  fireLight.intensity = (4 + lampLevel * 6) * flick;
  flames.forEach(f => { const s = 1 + Math.sin(T * 10 + f.userData.k) * .18; f.scale.set(1, s, 1); f.position.y = .1 + f.userData.h * s / 2; });
  candleFlames.forEach((c, i) => c.scale.setScalar(1 + Math.sin(T * 12 + i) * .15)); tableCandle.scale.setScalar(1 + Math.sin(T * 13) * .15);
  const cooking = people.some(p => p.spot === 'cook' && p.mode === 'act');
  stoveGlow.intensity = cooking ? 1.2 : 0; ovenGlow.material.emissiveIntensity = cooking ? .8 : 0;
  steam.forEach(s => { s.visible = cooking; const pr = (T * .3 + s.userData.o) % 1; s.position.set(2.0 + Math.sin(T + s.userData.o * 9) * .08, 1.3 + pr, -3.15); s.scale.setScalar(1 + pr * 2); s.material.opacity = .45 * (1 - pr); });

  fallLeaves.forEach((l, i) => {
    if (!l.ground) {
      l.y -= l.vy * dt; l.x += (Math.sin(T * 1.3 + l.ph) * .3 + .12) * dt; l.z += Math.cos(T * .9 + l.ph) * .15 * dt;
      dummy.rotation.set(T * 1.7 + l.ph, T + l.ph, T * .6);
      if (l.y <= -.39) { l.y = -.39; l.ground = rand(10, 22); }
    } else {
      l.ground -= dt; dummy.rotation.set(-Math.PI / 2, 0, l.rz);
      if (l.ground < 2) l.y -= dt * .02;
      if (l.ground <= 0) spawnLeaf(l, false);
    }
    dummy.position.set(l.x, l.y, l.z); dummy.updateMatrix(); fl.setMatrixAt(i, dummy.matrix);
  });
  fl.instanceMatrix.needsUpdate = true;

  updateHouse();
  people.forEach(p => updatePerson(p, sdt));
  updatePlay(sdt);
  cats.forEach(c => updateCat(c, sdt));
  people.forEach(p => updateBubble(p, false, sdt)); cats.forEach(c => updateBubble(c, true, sdt));

  const st = [
    ...people.map(p => `<b>${p.name}</b>${p.mode === 'act' ? SPOTS[p.spot].icon + ' ' + SPOTS[p.spot].label : '🚶 heading to the ' + ROOM_NAME[roomOf(SPOTS[p.target].x, SPOTS[p.target].z)]}`),
    ...cats.map(c => `<b>${c.name}</b>${c.mode === 'playing' || c.mode === 'playWait' || c.pendingAct === 'playWait' && c.mode === 'walk' ? '🧶 playing with ' + cats.find(o => o !== c).name
      : c.mode === 'act' ? (CAT_ICON[c.act] || '🐾') + ' ' + CAT_LABEL[c.act] : '🐾 trotting around'}`)].join('<br>');
  if (st !== lastStatus) { document.getElementById('status').innerHTML = st; lastStatus = st; }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
