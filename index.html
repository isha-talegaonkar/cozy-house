// ---------------------------------------------------------------- materials

function planks(c1, c2, c3, line) {

    const cols = [c1, c2, c3];
    for (let r = 0; r < 8; r++) for (let s = -1; s < 3; s++) {

  S: planks('#c9a27a', '#bf9870', '#d1ab84', '#9a7450'),
  K: canvasTex(64, 64, g => { for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { g.fillStyle = (i + j) % 2 ? '#c46a4a' : '#efe2c8'; g.fillRect(i * 16, j * 16, 16, 16); } }, [5, 3.5]),
  B: canvasTex(128, 128, g => { g.fillStyle = '#c49a94'; g.fillRect(0, 0, 128, 128); for (let i = 0; i < 1400; i++) { g.fillStyle = Math.random() < .5 ? '#b98c86' : '#cfa8a2'; g.fillRect(Math.random() * 128, Math.random() * 128, 2, 2); } }, [2, 2]),
};
for (const t of Object.values(floors)) t.magFilter = THREE.NearestFilter;
floors.K.magFilter = THREE.NearestFilter;
B(10.4, .4, 7.4, stone, 0, -.25, 0);
[['B', -2.5, -1.75, 3.5], ['L', -2.5, 1.75, 3.5], ['K', 2.5, -2.05, 2.9], ['S', 2.5, 1.45, 4.1]].forEach(([k, x, z, d]) =>
  B(5, .1, d, M('#ffffff', { map: floors[k], flatShading: false }), x, -.04, z));

// monstera leaf: heart shape with midrib, veins, edge splits and holes cut out (alpha), gently cupped
const monsteraTex = canvasTex(256, 256, (g) => {
  g.translate(128, 0);
  const leaf = () => { g.beginPath(); g.moveTo(0, 12); g.bezierCurveTo(70, 18, 122, 70, 120, 140); g.bezierCurveTo(118, 200, 80, 246, 40, 246);
    g.bezierCurveTo(18, 246, 6, 230, 0, 214); g.bezierCurveTo(-6, 230, -18, 246, -40, 246); g.bezierCurveTo(-80, 246, -118, 200, -120, 140); g.bezierCurveTo(-122, 70, -70, 18, 0, 12); };

    wand.pos.set(WAND_AT.x + Math.sin(T * 1.3) * .45, .06 + Math.abs(Math.sin(T * 2.6)) * .3, WAND_AT.z + Math.sin(T * .9) * .3);

function updateCat(c, dt) {

function updatePlay(dt) {
  if (!play) return;
  const [a, b] = play.cats;
  if (!play.start) { if (a.mode === 'playWait' && b.mode === 'playWait') { play.start = simT; a.mode = b.mode = 'playing'; a.bubbleT = b.bubbleT = 0; } return; }
  const e = simT - play.start; play.phase = Math.floor(e / 4) % 2;
  if (play.phase === 0) {

    [[a, ang], [b, ang - 1.0]].forEach(([c, t]) => { c.x = at.x + Math.cos(t) * .5; c.z = at.z + Math.sin(t) * .4; c.heading = Math.atan2(-Math.sin(t) * .5, Math.cos(t) * .4); c.walkPhase += dt * 14; });
    if (at === PLAY) { yarn.position.set(PLAY.x + Math.cos(ang + .5) * .5, .08, PLAY.z + Math.sin(ang + .5) * .4); yarn.rotation.x += dt * 6; }
  } else {
    a.heading = Math.atan2(b.x - a.x, b.z - a.z); b.heading = Math.atan2(a.x - b.x, a.z - b.z);

const CAT_ICON = { nap: '💤', eat: '🐟', groom: '✨', beg: '❤️', lap: '💕', wand: '🪶' };
const CAT_LABEL = { nap: 'napping', eat: 'eating', groom: 'grooming', beg: 'begging for a treat', idle: 'exploring', wand: 'chasing the feather toy' };

function updateBubble(a, isCat, dt) {

  let icon = null;
  if (isCat) icon = a.mode === 'playing' ? '🧶' : a.mode === 'act' ? CAT_ICON[a.act] : null;
  else icon = a.mode === 'act' ? SPOTS[a.spot].icon : null;
  const show = icon && (a.bubbleT % 18) < 5;

    const hp = new THREE.Vector3(); (isCat ? a.rig.head : a.rig.head).getWorldPosition(hp);
    a.bubble.position.set(hp.x, hp.y + (isCat ? .4 : .55) + Math.sin(simT * 1.5 + a.ph) * .04, hp.z);
    const k = Math.min(1, (a.bubbleT % 18) * 3, (5 - a.bubbleT % 18) * 3); a.bubble.scale.setScalar((isCat ? .42 : .55) * Math.max(.01, k));

}

// ---------------------------------------------------------------- lighting + day cycle
const hemi = new THREE.HemisphereLight('#c8d0e8', '#5a4030', .8); scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffd9a8', 2.4);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0005;
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 80 });
scene.add(sun, sun.target);
const KEYS = [
  [0, '#151a33', '#6f86c8', .2, .3, 1], [5.5, '#1c2340', '#6f86c8', .2, .32, 1], [7, '#f2b38a', '#ffb37a', 1.4, .6, .5],
  [10, '#b9cfd9', '#fff0d8', 2.6, .9, 0], [15.5, '#d9c9b0', '#ffd9a8', 2.4, .85, 0], [17.5, '#f0a070', '#ff9a5a', 1.8, .65, .6],
  [19, '#6a4a6a', '#ff7a5a', .6, .4, 1], [20.5, '#1f2140', '#6f86c8', .22, .3, 1], [24, '#151a33', '#6f86c8', .2, .3, 1]];
const cA = new THREE.Color(), cB = new THREE.Color();
let lampLevel = 0;
function updateDay() {
  let i = 0; while (i < KEYS.length - 2 && KEYS[i + 1][0] <= hour) i++;
  const [h0, s0, u0, si0, hi0, l0] = KEYS[i], [h1, s1, u1, si1, hi1, l1] = KEYS[i + 1], k = (hour - h0) / (h1 - h0);
  const sky = cA.set(s0).lerp(cB.set(s1), k);
  scene.background = sky.clone(); scene.fog.color.copy(sky);
  sun.color.set(u0).lerp(cB.set(u1), k); sun.intensity = si0 + (si1 - si0) * k;
  hemi.intensity = hi0 + (hi1 - hi0) * k; hemi.color.copy(sky).lerp(cB.set('#ffffff'), .5);
  lampLevel = l0 + (l1 - l0) * k;

  if (hour > 6 && hour < 19.5) { const a = (hour - 6) / 13.5 * Math.PI; dir = new THREE.Vector3(Math.cos(a), Math.sin(a) * .9 + .12, .55); }
  else dir = new THREE.Vector3(-.4, .9, .5);
  sun.position.copy(dir.normalize().multiplyScalar(40));
  lights.forEach(l => l.intensity = l.userData.base * lampLevel);

  postMat.emissiveIntensity = lampLevel * 1.5; lantern.material.emissiveIntensity = lampLevel * 2;
  const hh = Math.floor(hour), mm = Math.floor((hour % 1) * 60);

// ---------------------------------------------------------------- music (generated in the browser, no files)
let audio = null, musicOn = false;
function makeAudio() {
  const ctx = new AudioContext(), master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
  const conv = ctx.createConvolver(), len = ctx.sampleRate * 3.5, ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5); }
  conv.buffer = ir;
  const wet = ctx.createGain(); wet.gain.value = .55; conv.connect(wet).connect(master);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800; lp.connect(master); lp.connect(conv);
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

    [0, 6].forEach(det => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = mtof(m); o.detune.value = det;

  };
  const pluck = (m, t) => {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = mtof(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.07, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + 2.5);
    o.connect(g).connect(lp); o.start(t); o.stop(t + 2.6);

  const scale = [60, 62, 64, 67, 69, 72, 74, 76, 79];
  let next = ctx.currentTime + .2, ci = 0;
  setInterval(() => {
    while (next < ctx.currentTime + 1.5) {
      const ch = chords[ci++ % chords.length];
      ch.forEach(m => pad(m, next, 8.5));
      for (let b = 0; b < 8; b++) if (Math.random() < .42) pluck(Math.random() < .5 ? pick(ch) + 12 : pick(scale), next + b + rand(0, .08));

    }

  let brown = 0;
  for (let i = 0; i < cl; i++) { brown = (brown + (Math.random() * 2 - 1) * .02) * .995; cd[i] = brown * .6; }
  for (let k = 0; k < 140; k++) { const s = Math.floor(Math.random() * (cl - 400)), amp = rand(.1, .6); for (let i = 0; i < 300; i++) cd[s + i] += (Math.random() * 2 - 1) * amp * Math.exp(-i / 40); }

// iPhones mute Web Audio unless the page is in the "playback" audio category:
// ask for it directly (newer Safari) and also play a silent looping clip, which does the same on older versions.
let unlockClip = null;
function silentWavURL() {
  const sr = 8000, n = sr, b = new ArrayBuffer(44 + n * 2), v = new DataView(b), w = (o, str) => [...str].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));

document.getElementById('music').onclick = e => {
  if (navigator.audioSession) try { navigator.audioSession.type = 'playback'; } catch {}
  if (!unlockClip) { unlockClip = new Audio(silentWavURL()); unlockClip.loop = true; unlockClip.setAttribute('playsinline', ''); }
  if (!audio) audio = makeAudio();
  musicOn = !musicOn;
  if (musicOn) unlockClip.play().catch(() => {}); else unlockClip.pause();
  const { ctx, master } = audio; ctx.resume();
  master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
  master.gain.linearRampToValueAtTime(musicOn ? .7 : 0, ctx.currentTime + 2);

document.getElementById('zoomIn').onclick = () => zoomBy(1.25);
document.getElementById('zoomOut').onclick = () => zoomBy(1 / 1.25);

document.getElementById('rotR').onclick = () => camAzTarget += Math.PI / 2;

document.getElementById('speed').onclick = e => { const steps = [1, 2, 5, 20]; speed = steps[(steps.indexOf(speed) + 1) % steps.length]; document.getElementById('speed').innerHTML = `<span class="txt">Speed </span>${speed}×`; };

// ---------------------------------------------------------------- main loop
const clock = new THREE.Clock();
let lastStatus = '';
function frame() {
  const dt = Math.min(.05, clock.getDelta()), T = clock.elapsedTime, sdt = dt * speed;
  simT += sdt; hour += sdt / 60;   // 1 in-game minute = 1 second at 1x

  camAz += (camAzTarget - camAz) * Math.min(1, dt * 4);

  keyPan(dt);
  camera.position.copy(cd).multiplyScalar(CAM_D).add(camTarget); camera.lookAt(camTarget);
  walls.forEach(w => { const low = w.n[0] * Math.sin(camAz) + w.n[1] * Math.cos(camAz) > .1; w.tall.visible = !low; w.low.visible = low; });

  fireLight.intensity = (4 + lampLevel * 6) * flick;

  candleFlames.forEach((c, i) => c.scale.setScalar(1 + Math.sin(T * 12 + i) * .15)); tableCandle.scale.setScalar(1 + Math.sin(T * 13) * .15);
  const using = k => people.some(p => p.mode === 'act' && p.spot === k);
  const brewing = people.some(p => p.mode === 'act' && p.spot === 'coffee' && p.timer > p.dur * .55);

  coffeeSteam.forEach(s => { s.visible = brewing; const pr = (T * .5 + s.userData.o) % 1; s.position.set(2.8 + Math.sin(T * 2 + s.userData.o * 7) * .02, 1.07 + pr * .3, -3.1); s.material.opacity = .5 * (1 - pr); });

  if (tvOn) (using('games') ? drawGame : using('football') ? drawFootball : drawTV)(T);
  const baking = people.some(p => p.spot === 'bake' && p.mode === 'act');

  laptopMat.color.set(using('laptop') ? '#ffffff' : '#222222'); monitorMat.color.set(using('computer') ? '#ffffff' : '#222222');
  const cooking = people.some(p => p.spot === 'cook' && p.mode === 'act');
  stoveGlow.intensity = cooking ? 1.2 : 0; ovenGlow.material.emissiveIntensity = cooking || using('bake') ? .8 : 0;
  steam.forEach(s => { s.visible = cooking; const pr = (T * .3 + s.userData.o) % 1; s.position.set(2.0 + Math.sin(T + s.userData.o * 9) * .08, 1.3 + pr, -3.15); s.scale.setScalar(1 + pr * 2); s.material.opacity = .45 * (1 - pr); });

  fallLeaves.forEach((l, i) => {
    if (!l.ground) {
      l.y -= l.vy * dt; l.x += (Math.sin(T * 1.3 + l.ph) * .3 + .12) * dt; l.z += Math.cos(T * .9 + l.ph) * .15 * dt;
      dummy.rotation.set(T * 1.7 + l.ph, T + l.ph, T * .6);
      if (l.y <= -.39) { l.y = -.39; l.ground = rand(10, 22); }
    } else {

  wand.active = false; wandStick.visible = feather.visible = false;
  people.forEach(p => updatePerson(p, sdt));

  cats.forEach(c => updateCat(c, sdt));

  const st = [
    ...people.map(p => `${p.mode === 'act' ? SPOTS[p.spot].icon + ' ' + SPOTS[p.spot].label + (p.lapCat && p.lapCat.act === 'lap' && p.lapCat.mode === 'act' ? ` · ${p.lapCat.name} on lap` : '') : '🚶 heading to the ' + ROOM_NAME[roomOf(SPOTS[p.target].x, SPOTS[p.target].z)]}`),
    ...cats.map(c => `${c.mode === 'playing' || c.mode === 'playWait' || c.pendingAct === 'playWait' && c.mode === 'walk' ? '🧶 playing with ' + cats.find(o => o !== c).name
      : c.mode === 'act' ? (CAT_ICON[c.act] || '🐾') + ' ' + (c.act === 'lap' ? `curled up on ${c.lapOf ? c.lapOf.name + "'s" : 'a'} lap` : CAT_LABEL[c.act]) : '🐾 trotting around'}`)];
  const left = people.map(p => p.cmd ? `${Math.max(1, Math.ceil(p.cmd.until - simT))} min left` : '');
  const key = st.join('|') + left.join('|');
  if (key !== lastStatus) {

    people.forEach((p, i) => {
      document.getElementById(`st${i}`).textContent = st[i]; document.getElementById(`left${i}`).textContent = left[i];
      document.getElementById(`bar${i}`).style.width = p.cmd ? `${100 * Math.max(0, p.cmd.until - simT) / p.cmd.dur}%` : '0%';
    });
    cats.forEach((c, i) => document.getElementById(`cst${i}`).textContent = st[people.length + i]);
    document.getElementById('mini').textContent = [...people, ...cats].map((a, i) => `${a.name} ${[...st[i]][0] || ''}`).join(' · ');
  }

}
