<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Style 3 · Low-poly 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a1c2e; color: #f3d9b1; font-family: Georgia, serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; }
  .label { position: fixed; top: 14px; left: 0; right: 0; text-align: center; pointer-events: none; }
  h1 { font-weight: normal; letter-spacing: 1px; margin: 0; }
  p { max-width: 720px; margin: 6px auto 0; opacity: .8; line-height: 1.5; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.164.0/build/three.module.js" } }</script>
</head>
<body>
<div id="wrap"></div>
<div class="label">
  <h1>Style 3 · Low-poly 3D</h1>
  <p>A real 3D dollhouse with live lighting, shadows and a slowly drifting camera. It feels the most like the Sims and takes the most work to build.</p>
</div>
<script type="module">
import * as THREE from 'three';

const wrap = document.getElementById('wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#2a1c2e');
scene.fog = new THREE.Fog('#2a1c2e', 20, 42);
const camera = new THREE.PerspectiveCamera(35, 1, .1, 100);
function resize() { renderer.setSize(wrap.clientWidth, wrap.clientHeight); camera.aspect = wrap.clientWidth / wrap.clientHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .85, flatShading: true, ...o });
function add(geo, mat, x, y, z, parent = scene) {
  const m = new THREE.Mesh(geo, typeof mat === 'string' ? M(mat) : mat);
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
const B = (w, h, d, mat, x, y, z, parent) => add(new THREE.BoxGeometry(w, h, d), mat, x, y, z, parent);

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// --- room ---
const planks = canvasTex(512, 512, g => {
  const cols = ['#9a6440', '#8f5c3a', '#a06a45', '#946039'];
  for (let r = 0; r < 16; r++) for (let s = 0; s < 4; s++) {
    g.fillStyle = cols[(r * 3 + s) % 4]; g.fillRect(s * 128 + (r % 2) * 64, r * 32, 128, 32);
    g.fillStyle = '#5e371f'; g.fillRect(s * 128 + (r % 2) * 64, r * 32, 2, 32);
  }
  g.fillStyle = '#5e371f'; for (let r = 0; r < 16; r++) g.fillRect(0, r * 32, 512, 2);
});
B(8, .2, 8, M('#ffffff', { map: planks, flatShading: false }), 0, -.1, 0);

const wallMat = M('#cf9468'), wainMat = M('#8c5a3e'), trim = M('#5a3624');
// back wall (z = -4) with a window hole
B(8.2, 1.0, .2, wallMat, -.1, .5, -4.1);
B(8.2, .8, .2, wallMat, -.1, 2.8, -4.1);
B(2.6, 1.4, .2, wallMat, -2.9, 1.7, -4.1);
B(3.6, 1.4, .2, wallMat, 2.2, 1.7, -4.1);
// left wall (x = -4)
B(.2, 3.2, 8, M('#b97a58'), -4.1, 1.6, 0);
B(8, .9, .04, wainMat, 0, .45, -3.98);
B(.04, .9, 8, wainMat, -3.98, .45, 0);
B(8, .06, .08, trim, 0, .92, -3.96);
B(.08, .06, 8, trim, -3.96, .92, 0);

// window frame + curtains
const frame = M('#4a2c1c');
B(2.1, .1, .3, frame, -.6, 1.0, -4.05); B(2.1, .1, .3, frame, -.6, 2.4, -4.05);
B(.1, 1.5, .3, frame, -1.6, 1.7, -4.05); B(.1, 1.5, .3, frame, .4, 1.7, -4.05);
B(.06, 1.4, .1, frame, -.6, 1.7, -4.05); B(2, .06, .1, frame, -.6, 1.7, -4.05);
B(2.4, .08, .35, M('#6e4430'), -.6, .95, -3.85);
const curtain = M('#8e3b2f');
B(.45, 1.9, .08, curtain, -2.0, 1.75, -3.92); B(.45, 1.9, .08, curtain, .8, 1.75, -3.92);
B(3.4, .05, .05, frame, -.6, 2.72, -3.9);

// --- outside: dusk sky, autumn trees, ground ---
const sky = canvasTex(64, 256, g => {
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#3d2f5a'); gr.addColorStop(.45, '#c96a68'); gr.addColorStop(.75, '#f4ad6c'); gr.addColorStop(1, '#f8cf8a');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 256);
});
const skyPlane = new THREE.Mesh(new THREE.PlaneGeometry(60, 18), new THREE.MeshBasicMaterial({ map: sky, fog: false }));
skyPlane.position.set(0, 5, -16); scene.add(skyPlane);
const ground = add(new THREE.PlaneGeometry(60, 30), '#5a4426', 0, -.2, -10); ground.rotation.x = -Math.PI / 2;
const sun = new THREE.Mesh(new THREE.CircleGeometry(.9, 24), new THREE.MeshBasicMaterial({ color: '#ffe2a0', fog: false }));
sun.position.set(2, 1.6, -15.9); scene.add(sun);

const leafCols = ['#e07b39', '#c9512c', '#f0a640', '#a8432a', '#d9893a'];
function tree(x, z, s) {
  add(new THREE.CylinderGeometry(.12 * s, .18 * s, 1.6 * s, 6), '#3b2418', x, .8 * s, z);
  [[0, 2.0, 0, .9], [.5, 1.7, .2, .6], [-.5, 1.8, -.1, .65], [.1, 2.5, .1, .55]].forEach(([dx, dy, dz, r], i) =>
    add(new THREE.IcosahedronGeometry(r * s, 0), leafCols[(i + Math.round(x)) % 5], x + dx * s, dy * s, z + dz * s));
}
tree(-1.4, -7, 1.3); tree(2.8, -9, 1.6); tree(-5, -10, 1.5); tree(6, -7.5, 1.2); tree(-8, -6.5, 1.1);

// falling leaves (outside)
const leafGeo = new THREE.PlaneGeometry(.12, .07);
const leaves = Array.from({ length: 70 }, (_, i) => {
  const m = new THREE.Mesh(leafGeo, new THREE.MeshStandardMaterial({ color: leafCols[i % 5], side: THREE.DoubleSide }));
  m.position.set(-10 + Math.random() * 20, Math.random() * 6, -13 + Math.random() * 8.5);
  m.userData = { s: .25 + Math.random() * .35, ph: Math.random() * 6 };
  scene.add(m); return m;
});

// --- lighting ---
scene.add(new THREE.HemisphereLight('#7a6a9a', '#3a2418', .7));
const sunLight = new THREE.DirectionalLight('#ffad6a', 2.2);
sunLight.position.set(-1.5, 3.5, -12); sunLight.target.position.set(.5, 0, 0);
sunLight.castShadow = true; sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
scene.add(sunLight, sunLight.target);

// --- fireplace ---
const stone = M('#8f857c');
B(.8, 1.4, 2.0, stone, -3.6, .7, .5);
B(.6, 1.8, 1.4, stone, -3.7, 2.3, .5);
B(.12, .8, 1.0, M('#140b08'), -3.22, .4, .5);
B(1.0, .12, 2.3, M('#6e4430'), -3.5, 1.46, .5);
const fire = new THREE.Group(); fire.position.set(-3.1, .05, .5); scene.add(fire);
const log = new THREE.CylinderGeometry(.06, .06, .6, 6);
[-.4, .4].forEach(r => { const l = add(log, '#4a2e1e', 0, .05, 0, fire); l.rotation.set(Math.PI / 2, r, 0); });
const flames = [['#c2401f', .2, .55], ['#f07b2a', .15, .42], ['#ffd05a', .09, .28]].flatMap(([c, r, h], k) =>
  [-.15, 0, .15].map(dz => { const f = new THREE.Mesh(new THREE.ConeGeometry(r, h, 6), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: .9 }));
    f.position.set(.02 * k, .1 + h / 2, dz); f.userData = { h, k: k * 3 + dz * 10 }; fire.add(f); return f; }));
const fireLight = new THREE.PointLight('#ff8a3d', 14, 0, 1.6);
fireLight.position.set(-2.8, .6, .5); fireLight.castShadow = true; fireLight.shadow.mapSize.set(1024, 1024); scene.add(fireLight);
// mantel decor
const candles = [-.1, .15].map(z => {
  add(new THREE.CylinderGeometry(.04, .04, .22, 8), '#efe2c4', -3.3, 1.63, z);
  return add(new THREE.SphereGeometry(.03, 6, 6), new THREE.MeshBasicMaterial({ color: '#ffcf6b' }), -3.3, 1.77, z);
});
B(.06, .35, .45, M('#5a3626'), -3.6, 1.7, .7); B(.02, .27, .37, M('#e6b77a'), -3.56, 1.7, .7);
add(new THREE.CylinderGeometry(.07, .05, .18, 8), '#b5543f', -3.35, 1.61, 1.35);
add(new THREE.IcosahedronGeometry(.13, 0), '#c9512c', -3.35, 1.8, 1.35);

// bookshelf
const shelf = new THREE.Group(); shelf.position.set(-3.75, 0, -2.6); scene.add(shelf);
B(.4, 2.0, 1.3, '#5a3624', 0, 1.0, 0, shelf);
const bookCols = ['#8e3b2f', '#3f6a6a', '#c9a36b', '#7d8a58', '#5a4a6a', '#b5543f', '#e6c48a'];
[.08, .55, 1.02, 1.49].forEach((y, r) => {
  B(.42, .04, 1.3, '#4a2e1e', .02, y, 0, shelf);
  for (let z = -.55, k = r; z < .55; z += .09, k++) { const h = .28 + (k % 3) * .04; B(.28, h, .07, bookCols[k % 7], .1, y + .02 + h / 2, z, shelf); }
});

// rug + sofa
const rug = add(new THREE.CylinderGeometry(1.5, 1.5, .02, 32), '#8e3b2f', -1.7, .01, .6); rug.scale.z = .8;
const rug2 = add(new THREE.CylinderGeometry(1.25, 1.25, .025, 32), '#b5543f', -1.7, .01, .6); rug2.scale.z = .8;
const sofaMat = M('#6f7d4e');
B(.9, .4, 2.2, sofaMat, -.4, .2, .5);
B(.28, .6, 2.2, sofaMat, -.08, .65, .5);
B(.9, .58, .22, M('#5d6840'), -.4, .29, -.69); B(.9, .58, .22, M('#5d6840'), -.4, .29, 1.69);
B(.15, .32, .4, M('#c9763f'), -.25, .6, -.2); B(.15, .32, .4, M('#e6c48a'), -.25, .6, 1.2);

// floor lamp
add(new THREE.CylinderGeometry(.15, .18, .04, 12), '#3a2418', .3, .02, 1.9);
add(new THREE.CylinderGeometry(.015, .015, 1.6, 6), '#3a2418', .3, .8, 1.9);
add(new THREE.CylinderGeometry(.16, .26, .3, 12, 1, true), M('#ecc27a', { emissive: '#ffb860', emissiveIntensity: .6, side: THREE.DoubleSide }), .3, 1.6, 1.9);
const lampLight = new THREE.PointLight('#ffc27a', 4, 0, 1.8); lampLight.position.set(.3, 1.5, 1.9); scene.add(lampLight);

// kitchen
B(2.7, .9, .7, '#7a5236', 2.5, .45, -3.6);
B(2.8, .06, .78, '#e6d6bd', 2.5, .93, -3.6);
B(.7, .02, .5, '#2a2624', 2.0, .97, -3.6);
add(new THREE.CylinderGeometry(.16, .14, .2, 10), '#8a8f94', 2.0, 1.08, -3.6);
add(new THREE.CylinderGeometry(.17, .17, .02, 10), '#b8bcc0', 2.0, 1.19, -3.6);
B(2.7, .05, .3, '#5a3624', 2.5, 2.0, -3.85);
[['#c9a36b', .2], ['#8e3b2f', .15], ['#7d8a58', .24], ['#e6c48a', .17], ['#b5543f', .14]].forEach(([c, h], i) =>
  add(new THREE.CylinderGeometry(.07, .07, h, 8), c, 1.4 + i * .5, 2.03 + h / 2, -3.85));
const steam = Array.from({ length: 5 }, (_, i) => { const s = add(new THREE.SphereGeometry(.06, 6, 6), new THREE.MeshBasicMaterial({ color: '#f3e9da', transparent: true, depthWrite: false }), 2.0, 1.3, -3.6); s.castShadow = false; s.userData.o = i / 5; return s; });
const stoveGlow = new THREE.PointLight('#ffb070', 1.2, 0, 2); stoveGlow.position.set(2.0, 1.4, -3.3); scene.add(stoveGlow);

// table + chairs
const wood = M('#8a5634');
add(new THREE.CylinderGeometry(.6, .6, .06, 16), wood, 2.2, .75, 1.2);
add(new THREE.CylinderGeometry(.06, .1, .75, 8), '#4a2e1e', 2.2, .37, 1.2);
add(new THREE.CylinderGeometry(.13, .1, .05, 12), '#efe2c4', 2.2, .8, 1.55);
add(new THREE.CylinderGeometry(.03, .03, .2, 8), '#efe2c4', 2.0, .88, 1.0);
const tableCandle = add(new THREE.SphereGeometry(.03, 6, 6), new THREE.MeshBasicMaterial({ color: '#ffcf6b' }), 2.0, 1.0, 1.0);
[[2.2, 1.95, 0], [2.2, .45, Math.PI]].forEach(([x, z, r]) => {
  const ch = new THREE.Group(); ch.position.set(x, 0, z); ch.rotation.y = r; scene.add(ch);
  B(.45, .05, .45, '#7a4a2c', 0, .42, 0, ch); B(.45, .5, .05, '#7a4a2c', 0, .67, .2, ch);
  [[-.18, -.18], [.18, -.18], [-.18, .18], [.18, .18]].forEach(([a, b]) => B(.04, .42, .04, '#5e371f', a, .21, b, ch));
});

// string lights
const bulbCols = ['#ffcf6b', '#ff8f5a', '#ffe9a8', '#f7a35c'];
const bulbs = [];
for (let i = 0; i < 16; i++) bulbs.push(add(new THREE.SphereGeometry(.04, 6, 6), new THREE.MeshBasicMaterial({ color: bulbCols[i % 4] }), -3.8 + i * .5, 3.0 - Math.abs(Math.sin(i * .8)) * .12, -3.95));
for (let i = 0; i < 15; i++) bulbs.push(add(new THREE.SphereGeometry(.04, 6, 6), new THREE.MeshBasicMaterial({ color: bulbCols[i % 4] }), -3.95, 3.0 - Math.abs(Math.sin(i * .8)) * .12, -3.5 + i * .5));

// --- people ---
function person({ skin, hair, shirt, pants, pose = 'stand', bun = false }) {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const mSkin = M(skin, { flatShading: false }), mPants = M(pants), mShirt = M(shirt);
  if (pose === 'stand') {
    [-.08, .08].forEach(x => add(new THREE.CapsuleGeometry(.07, .5, 4, 8), mPants, x, .35, 0, root));
  } else {
    const hipY = pose === 'floor' ? .1 : .45;
    root.userData.hipY = hipY;
    [-.08, .08].forEach(x => {
      const th = add(new THREE.CapsuleGeometry(.07, .3, 4, 8), mPants, x, hipY, .18, root); th.rotation.x = Math.PI / 2;
      if (pose === 'sit') add(new THREE.CapsuleGeometry(.065, .3, 4, 8), mPants, x, hipY - .22, .36, root);
    });
  }
  const base = pose === 'stand' ? .7 : root.userData.hipY;
  body.position.y = base;
  add(new THREE.CapsuleGeometry(.17, .3, 4, 10), mShirt, 0, .28, 0, body);
  const arms = [-.22, .22].map(x => { const a = new THREE.Group(); a.position.set(x, .45, 0); body.add(a); add(new THREE.CapsuleGeometry(.05, .3, 4, 8), mShirt, 0, -.18, 0, a); add(new THREE.SphereGeometry(.05, 8, 8), mSkin, 0, -.38, 0, a); return a; });
  const head = new THREE.Group(); head.position.y = .7; body.add(head);
  add(new THREE.SphereGeometry(.16, 16, 12), mSkin, 0, 0, 0, head);
  add(new THREE.SphereGeometry(.172, 16, 12, 0, Math.PI * 2, 0, Math.PI * .5), M(hair), 0, .01, -.01, head);
  add(new THREE.SphereGeometry(.15, 12, 10), M(hair), 0, .0, -.05, head).scale.set(1.08, .9, 1);
  if (bun) add(new THREE.SphereGeometry(.07, 8, 8), M(hair), 0, .1, -.16, head);
  [-.06, .06].forEach(x => add(new THREE.SphereGeometry(.018, 6, 6), M('#2a1a14'), x, .01, .15, head));
  return { root, body, arms, head };
}
const mom = person({ skin: '#e9b48f', hair: '#4a2a1a', shirt: '#c9763f', pants: '#5a4a6a', bun: true });
mom.root.position.set(2.0, 0, -2.95); mom.root.rotation.y = Math.PI; scene.add(mom.root);
mom.arms[1].rotation.x = -1.1;

const dad = person({ skin: '#c48a65', hair: '#2e1d14', shirt: '#9a4a3a', pants: '#3a3f55', pose: 'sit' });
dad.root.position.set(-.4, -.05, .3); dad.root.rotation.y = -Math.PI / 2; scene.add(dad.root);
dad.arms[0].rotation.x = -1.2;
const mug = add(new THREE.CylinderGeometry(.045, .04, .09, 8), '#efe2c4', 0, -.4, .05, dad.arms[0]);

const grandpa = person({ skin: '#d8a07a', hair: '#d9d2c5', shirt: '#6a7f8e', pants: '#3e3a3a', pose: 'sit' });
grandpa.root.position.set(2.2, 0, 1.85); grandpa.root.rotation.y = Math.PI; scene.add(grandpa.root);

const kid = person({ skin: '#f0c4a0', hair: '#7a4a2a', shirt: '#e8c25a', pants: '#5a7a8a', pose: 'floor' });
kid.root.position.set(-1.9, 0, 1.3); kid.root.rotation.y = -Math.PI / 2 - .5; scene.add(kid.root);
kid.arms.forEach(a => a.rotation.x = -.9); kid.head.rotation.x = .35;
B(.05, .22, .3, M('#3f6a6a'), 0, .28, .3, kid.body);

// cat
const cat = new THREE.Group(); cat.position.set(-2.6, 0, -.1); cat.rotation.y = .6; scene.add(cat);
const catMat = M('#e0913f');
const catBody = add(new THREE.SphereGeometry(.18, 10, 8), catMat, 0, .12, 0, cat); catBody.scale.set(1.5, .75, 1);
add(new THREE.SphereGeometry(.1, 10, 8), catMat, .24, .15, .05, cat);
[.04, -.04].forEach(z => add(new THREE.ConeGeometry(.035, .07, 4), catMat, .26, .26, .05 + z, cat));
const tail = add(new THREE.CapsuleGeometry(.03, .3, 4, 6), catMat, -.18, .05, .18, cat); tail.rotation.set(Math.PI / 2, 0, .8);

// --- animate ---
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();
  const az = Math.PI / 4 + Math.sin(t * .07) * .35, el = .5 + Math.sin(t * .05) * .05, r = 14;
  camera.position.set(Math.sin(az) * Math.cos(el) * r, Math.sin(el) * r + .8, Math.cos(az) * Math.cos(el) * r);
  camera.lookAt(-.2, .9, -.2);

  const fl = 1 + Math.sin(t * 11) * .1 + Math.sin(t * 5.3) * .08 + (Math.random() - .5) * .06;
  fireLight.intensity = 14 * fl;
  flames.forEach(f => { const s = 1 + Math.sin(t * 10 + f.userData.k) * .18; f.scale.set(1, s, 1); f.position.y = .1 + f.userData.h * s / 2; });
  candles.forEach((c, i) => c.scale.setScalar(1 + Math.sin(t * 12 + i) * .15));
  tableCandle.scale.setScalar(1 + Math.sin(t * 13) * .15);
  bulbs.forEach((b, i) => b.material.color.setHSL(.08 + (i % 4) * .02, .9, .55 + .15 * Math.sin(t * 1.3 + i)));

  [mom, dad, grandpa, kid].forEach((p, i) => p.body.scale.set(1, 1 + Math.sin(t * 2 + i) * .012, 1));
  mom.arms[1].rotation.z = Math.sin(t * 3) * .35;
  mom.head.rotation.x = .2;
  dad.arms[0].rotation.x = -1.2 - Math.max(0, Math.sin(t * .5)) * .9;
  grandpa.arms[1].rotation.x = Math.sin(t * 1.6) > 0 ? -1.5 : -.8;
  if (t % 6 < .3) kid.arms[1].rotation.z = -.4; else kid.arms[1].rotation.z = 0;
  catBody.scale.y = .75 + Math.sin(t * 1.4) * .03;

  steam.forEach(s => { const pr = (t * .3 + s.userData.o) % 1; s.position.set(2.0 + Math.sin(t + s.userData.o * 9) * .08, 1.3 + pr * 1.0, -3.6); s.scale.setScalar(1 + pr * 2); s.material.opacity = .45 * (1 - pr); });
  leaves.forEach(l => { l.position.y -= l.userData.s * .016; l.position.x += Math.sin(t + l.userData.ph) * .006; l.rotation.set(t * 1.5 + l.userData.ph, t + l.userData.ph, 0); if (l.position.y < -.15) l.position.y = 6; });

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
