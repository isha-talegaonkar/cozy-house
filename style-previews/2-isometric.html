<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Style 2 · Isometric 2D</title>
<style>
  body { margin: 0; background: #1c1420; color: #f3d9b1; font-family: Georgia, serif;
         display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
  h1 { font-weight: normal; letter-spacing: 1px; margin: 16px 0 6px; }
  canvas { width: min(96vw, 1100px); aspect-ratio: 1200 / 760; }
  p { max-width: 720px; text-align: center; opacity: .8; line-height: 1.5; margin-top: 4px; }
</style>
</head>
<body>
<h1>Style 2 · Isometric 2D</h1>
<canvas id="c" width="1200" height="760"></canvas>
<p>A Sims 2-style dollhouse cutaway seen from a fixed angle, drawn in soft illustrated 2D. Cozy and diorama-like, and still light enough to load instantly.</p>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 1200, H = 760, T = 56, N = 7, WALL = 150;
const ox = W / 2, oy = 200;
const P = (x, y, z = 0) => [ox + (x - y) * T, oy + (x + y) * T / 2 - z];

function poly(pts, fill, stroke, lw = 1) {
  g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
}
function line(a, b, col, lw = 1) { g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.strokeStyle = col; g.lineWidth = lw; g.stroke(); }
function box(x, y, z, w, d, h, top, left, right) {
  poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)], left);
  poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)], right);
  poly([P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)], top);
}
function ell(x, y, rx, ry, col) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fillStyle = col; g.fill(); }
function rrect(x, y, w, h, r, col) { g.beginPath(); g.roundRect(x, y, w, h, r); g.fillStyle = col; g.fill(); }

const leafCols = ['#e07b39', '#c9512c', '#f0a640', '#a8432a', '#d9893a'];
const outsideLeaves = Array.from({ length: 40 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 15 + Math.random() * 25, r: Math.random() * 6, ph: Math.random() * 6, c: leafCols[Math.floor(Math.random() * 5)], z: Math.random() }));
const winLeaves = Array.from({ length: 10 }, () => ({ u: Math.random(), v: Math.random(), s: .04 + Math.random() * .05, ph: Math.random() * 6, c: leafCols[Math.floor(Math.random() * 5)] }));
const groundLeaves = Array.from({ length: 70 }, () => ({ x: -2.5 + Math.random() * 12, y: -2.5 + Math.random() * 12, c: leafCols[Math.floor(Math.random() * 5)], r: Math.random() * 3 }))
  .filter(l => !(l.x > -0.3 && l.x < N && l.y > -0.3 && l.y < N));
const stars = Array.from({ length: 60 }, () => [Math.random() * W, Math.random() * 260, Math.random()]);

function leaf(x, y, r, col, s = 1) {
  g.save(); g.translate(x, y); g.rotate(r); g.scale(s, s);
  g.beginPath(); g.ellipse(0, 0, 6, 3, 0, 0, Math.PI * 2); g.fillStyle = col; g.fill(); g.restore();
}

function background(t) {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#2b2040'); gr.addColorStop(.5, '#4a2c3e'); gr.addColorStop(1, '#2a1c22');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (const [x, y, k] of stars) { g.globalAlpha = .3 + .3 * Math.sin(t * 1.5 + k * 10); ell(x, y, 1.2, 1.2, '#ffe9c8'); }
  g.globalAlpha = 1;
  // autumn yard
  poly([P(-2.5, -2.5, -14), P(9.5, -2.5, -14), P(9.5, 9.5, -14), P(-2.5, 9.5, -14)], '#5a4426');
  poly([P(-2.5, 9.5, -14), P(9.5, 9.5, -14), P(9.5, 9.5, -40), P(-2.5, 9.5, -40)], '#3d2c1a');
  poly([P(9.5, -2.5, -14), P(9.5, 9.5, -14), P(9.5, 9.5, -40), P(9.5, -2.5, -40)], '#33241a');
  for (const l of groundLeaves) { const [sx, sy] = P(l.x, l.y, -14); leaf(sx, sy, l.r, l.c, .8); }
}

function floorAndWalls() {
  box(0, 0, -14, N, N, 14, '#000', '#4a2e1e', '#3e2619');
  const fc = ['#9a6440', '#946039', '#a06a45', '#8f5c3a'];
  for (let i = 0; i < N; i++) for (let j = 0; j < N * 2; j++) {
    poly([P(i, j / 2), P(i + 1, j / 2), P(i + 1, j / 2 + .5), P(i, j / 2 + .5)], fc[(i * 7 + j * 3) % 4], 'rgba(70,40,25,.35)');
  }
  // wall thickness
  box(-.25, 0, 0, .25, N, WALL, '#e8c9a5', '#8a5a40', '#8a5a40');
  box(0, -.25, 0, N, .25, WALL, '#e8c9a5', '#8a5a40', '#7a4e36');
  box(-.25, -.25, 0, .25, .25, WALL, '#e8c9a5', '#8a5a40', '#8a5a40');
  // inner faces: left wall (x=0) and right wall (y=0)
  poly([P(0, 0, 0), P(0, N, 0), P(0, N, WALL), P(0, 0, WALL)], '#b97a58');
  poly([P(0, 0, 0), P(N, 0, 0), P(N, 0, WALL), P(0, 0, WALL)], '#cf9468');
  for (let i = .5; i < N; i += .5) { line(P(0, i, 46), P(0, i, WALL), '#ad7050'); line(P(i, 0, 46), P(i, 0, WALL), '#c4895e'); }
  poly([P(0, 0, 0), P(0, N, 0), P(0, N, 46), P(0, 0, 46)], '#8c5a3e');
  poly([P(0, 0, 0), P(N, 0, 0), P(N, 0, 46), P(0, 0, 46)], '#9c6446');
  line(P(0, 0, 46), P(0, N, 46), '#6e4430', 3); line(P(0, 0, 46), P(N, 0, 46), '#6e4430', 3);
  for (let i = .25; i < N; i += .75) {
    poly([P(0, i, 8), P(0, i + .5, 8), P(0, i + .5, 38), P(0, i, 38)], null, '#7a4c34', 1.5);
    poly([P(i, 0, 8), P(i + .5, 0, 8), P(i + .5, 0, 38), P(i, 0, 38)], null, '#87563b', 1.5);
  }
}

function windowView(t) {
  const x0 = 1.2, x1 = 3.2, z0 = 58, z1 = 128;
  const pts = [P(x0, 0, z0), P(x1, 0, z0), P(x1, 0, z1), P(x0, 0, z1)];
  const top = Math.min(...pts.map(q => q[1])), bot = Math.max(...pts.map(q => q[1]));
  const left = pts[0][0], right = pts[1][0];
  g.save(); poly(pts); g.clip();
  const gr = g.createLinearGradient(0, top, 0, bot);
  gr.addColorStop(0, '#5d4a7c'); gr.addColorStop(.45, '#d97a68'); gr.addColorStop(.8, '#f6b874'); gr.addColorStop(1, '#f8cf8a');
  g.fillStyle = gr; g.fillRect(left, top, right - left, bot - top);
  ell(left + 80, top + 110, 16, 16, '#ffe2a0');
  ell(left + 60, bot + 20, 120, 50, '#6b3d2e');
  g.fillStyle = '#3b2418'; g.fillRect(left + 28, top + 70, 8, 80);
  [[32, 62, 30, '#c9512c'], [18, 74, 20, '#a8432a'], [48, 72, 22, '#e07b39'], [34, 46, 20, '#e07b39'], [40, 58, 10, '#f0a640']]
    .forEach(([dx, dy, r, c]) => ell(left + dx, top + dy, r, r * .85, c));
  for (const l of winLeaves) {
    const v = (l.v + t * l.s) % 1, u = (l.u + Math.sin(t + l.ph) * .03 + t * .01) % 1;
    leaf(left + u * (right - left), top + v * (bot - top) + 20, t * 2 + l.ph, l.c, .6);
  }
  g.restore();
  poly(pts, null, '#4a2c1c', 6);
  line(P(2.2, 0, z0), P(2.2, 0, z1), '#4a2c1c', 4); line(P(x0, 0, 93), P(x1, 0, 93), '#4a2c1c', 4);
  box(1.05, 0, 52, 2.3, .22, 6, '#6e4430', '#5a3624', '#4a2e1e');
  // curtains
  poly([P(.8, 0, 46), P(1.2, 0, 46), P(1.2, 0, 140), P(.8, 0, 140)], '#8e3b2f');
  poly([P(3.2, 0, 46), P(3.6, 0, 46), P(3.6, 0, 140), P(3.2, 0, 140)], '#8e3b2f');
  line(P(.95, 0, 46), P(.95, 0, 140), '#7a3127', 2); line(P(3.4, 0, 46), P(3.4, 0, 140), '#7a3127', 2);
  line(P(.7, 0, 142), P(3.7, 0, 142), '#3a2418', 4);
  // little plant on sill
  const [px, py] = P(1.6, .12, 58); rrect(px - 7, py - 12, 14, 12, 3, '#b5543f');
  ell(px - 5, py - 18, 6, 8, '#6b8a4a'); ell(px + 4, py - 20, 6, 9, '#7d9a58'); ell(px, py - 24, 5, 7, '#86a35f');
}

function stringLights(t) {
  const cols = ['#ffcf6b', '#ff8f5a', '#ffe9a8', '#f7a35c'];
  const pts = [];
  for (let i = 0; i <= 28; i++) { const s = i / 28 * N; pts.push(P(0, N - s, WALL - 10 - Math.abs(Math.sin(s * 1.6)) * 10)); }
  for (let i = 0; i <= 28; i++) { const s = i / 28 * N; pts.push(P(s, 0, WALL - 10 - Math.abs(Math.sin(s * 1.6)) * 10)); }
  g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(...q) : g.moveTo(...q)); g.strokeStyle = '#2a1a14'; g.lineWidth = 1.5; g.stroke();
  pts.forEach((q, i) => {
    if (i % 2) return;
    const on = .65 + .35 * Math.sin(t * 1.3 + i);
    g.globalAlpha = .35 * on; ell(q[0], q[1] + 4, 9, 9, cols[i % 4]); g.globalAlpha = 1;
    ell(q[0], q[1] + 4, 3.5, 4.5, cols[i % 4]);
  });
}

function fireplace(t) {
  box(0, 2.4, 0, .7, 2.1, WALL, '#8f857c', '#7a7068', '#857b72');
  for (let z = 12; z < WALL; z += 14) line(P(.7, 2.4, z), P(.7, 4.5, z), '#71685f', 1.5);
  for (let z = 0, r = 0; z < WALL; z += 14, r++) for (let y = 2.4 + (r % 2) * .25; y < 4.5; y += .5) line(P(.7, y, z), P(.7, y, z + 14), '#71685f', 1.5);
  poly([P(.7, 2.95, 0), P(.7, 3.95, 0), P(.7, 3.95, 46), P(.7, 2.95, 46)], '#1d1210');
  box(0, 2.25, 66, .95, 2.4, 9, '#6e4430', '#5a3624', '#4a2e1e');
  // logs + flames
  const [fx, fy] = P(.55, 3.45, 2);
  g.fillStyle = '#4a2e1e'; g.save(); g.translate(fx, fy); g.rotate(-.45); g.fillRect(-22, -5, 44, 8); g.rotate(.9); g.fillRect(-20, -5, 40, 8); g.restore();
  const fl = (k) => 1 + Math.sin(t * 9 + k) * .15 + Math.sin(t * 14 + k * 2) * .1;
  [['#c2401f', 18, 30, 0], ['#f07b2a', 13, 23, 1], ['#ffd05a', 7, 13, 2]].forEach(([c, rx, ry, k]) => {
    for (const dx of [-8, 0, 8]) { const h = ry * fl(k + dx); ell(fx + dx, fy - h * .6, rx * .55, h * .6, c); }
  });
  for (let k = 0; k < 4; k++) { const pr = (t * .7 + k / 4) % 1; g.globalAlpha = 1 - pr; ell(fx - 10 + k * 7 + Math.sin(t * 3 + k) * 4, fy - 20 - pr * 30, 1.6, 1.6, '#ffb347'); }
  g.globalAlpha = 1;
  // mantel decor
  const candle = (y) => { const [cx, cy] = P(.45, y, 75); rrect(cx - 3, cy - 16, 6, 16, 2, '#efe2c4'); ell(cx, cy - 20 + Math.sin(t * 10 + y) * .7, 2.5, 4, '#ffcf6b'); };
  candle(2.6); candle(2.85);
  const [kx, ky] = P(.4, 3.5, 75); rrect(kx - 14, ky - 30, 28, 30, 4, '#5a3626'); rrect(kx - 10, ky - 26, 20, 22, 2, '#e6b77a'); ell(kx, ky - 12, 7, 5, '#7d8a58');
  const [vx, vy] = P(.4, 4.3, 75); rrect(vx - 6, vy - 16, 12, 16, 4, '#b5543f'); ell(vx - 5, vy - 24, 4, 10, '#c9512c'); ell(vx + 5, vy - 22, 4, 9, '#e07b39');
}

function bookshelf() {
  box(0, 5.2, 0, .5, 1.5, 128, '#6e4430', '#5a3624', '#4a2e1e');
  const bc = ['#8e3b2f', '#3f6a6a', '#c9a36b', '#7d8a58', '#5a4a6a', '#b5543f', '#e6c48a'];
  [6, 38, 70, 100].forEach((z, r) => {
    line(P(.5, 5.2, z), P(.5, 6.7, z), '#3a2418', 3);
    for (let y = 5.28, k = r; y < 6.6; y += .11, k++) {
      const h = 20 + ((k * 7) % 3) * 3;
      poly([P(.5, y, z + 1), P(.5, y + .09, z + 1), P(.5, y + .09, z + h), P(.5, y, z + h)], bc[k % bc.length]);
    }
  });
}

function kitchen(t) {
  box(4.2, 0, 0, 2.7, .8, 40, '#e6d6bd', '#7a5236', '#6a4630');
  for (let x = 4.25; x < 6.9; x += .9) poly([P(x, .8, 5), P(x + .8, .8, 5), P(x + .8, .8, 34), P(x, .8, 34)], null, '#5a3624', 1.5);
  poly([P(5.0, .1, 40), P(5.9, .1, 40), P(5.9, .7, 40), P(5.0, .7, 40)], '#3a3432');
  const [px, py] = P(5.45, .4, 40);
  rrect(px - 17, py - 22, 34, 22, 5, '#8a8f94'); ell(px, py - 22, 17, 6, '#b8bcc0'); ell(px, py - 26, 3, 2, '#5a5f64');
  for (let k = 0; k < 4; k++) {
    const pr = (t * .35 + k / 4) % 1;
    g.globalAlpha = .45 * (1 - pr); ell(px + Math.sin(t * 1.8 + k * 2) * 8, py - 32 - pr * 60, 6 + pr * 8, 6 + pr * 8, '#f3e9da');
  }
  g.globalAlpha = 1;
  box(4.2, 0, 96, 2.7, .35, 5, '#6e4430', '#5a3624', '#4a2e1e');
  [[4.4, '#c9a36b', 20], [4.8, '#8e3b2f', 14], [5.2, '#7d8a58', 24], [5.7, '#e6c48a', 16], [6.2, '#c9a36b', 20], [6.6, '#b5543f', 13]].forEach(([x, c, h]) => {
    const [jx, jy] = P(x, .18, 101); rrect(jx - 7, jy - h, 14, h, 3, c); rrect(jx - 7, jy - h, 14, 4, 2, '#5a3624');
  });
}

function rug() {
  poly([P(1.1, 2.3), P(3.0, 2.3), P(3.0, 4.9), P(1.1, 4.9)], '#8e3b2f');
  poly([P(1.25, 2.45), P(2.85, 2.45), P(2.85, 4.75), P(1.25, 4.75)], null, '#d9894f', 3);
  poly([P(1.5, 2.8), P(2.6, 2.8), P(2.6, 4.4), P(1.5, 4.4)], null, '#e6b77a', 2);
}

function person(x, y, z, o, t) {
  const [sx, sy] = P(x, y, z), b = Math.sin(t * 2 + o.ph) * 1.3;
  if (!z) { g.globalAlpha = .25; ell(sx, sy, 16, 7, '#2a140a'); g.globalAlpha = 1; }
  let hip;
  if (o.pose === 'stand') { rrect(sx - 8, sy - 30, 7, 30, 3, o.pants); rrect(sx + 1, sy - 30, 7, 30, 3, o.pants); ell(sx - 4, sy, 5, 3, '#2a1a14'); ell(sx + 5, sy, 5, 3, '#2a1a14'); hip = sy - 28; }
  else if (o.pose === 'floor') { rrect(sx - 16, sy - 9, 32, 10, 5, o.pants); hip = sy - 5; }
  else { rrect(sx - 9, sy - 8, 18, 9, 4, o.pants); rrect(sx - 8, sy, 6, 18, 3, o.pants); rrect(sx + 2, sy, 6, 18, 3, o.pants); hip = sy - 4; }
  rrect(sx - 11, hip - 32 + b, 22, 34, 8, o.shirt);
  if (o.apron) rrect(sx - 8, hip - 20 + b, 16, 20, 3, '#f3e6cf');
  const aa = o.armAnim ? o.armAnim(t) : 0;
  rrect(sx - 15, hip - 29 + b, 6, 22, 3, o.shirt);
  rrect(sx + 9, hip - 29 + b + aa, 6, 22, 3, o.shirt);
  ell(sx + 12, hip - 6 + b + aa, 3.5, 3.5, o.skin);
  const hy = hip - 44 + b;
  ell(sx, hy, 12, 12.5, o.skin);
  if (o.back) { ell(sx, hy - 1, 13, 13.5, o.hair); if (o.bun) ell(sx, hy - 13, 6, 5, o.hair); }
  else {
    g.beginPath(); g.ellipse(sx, hy - 2, 13, 12, 0, Math.PI * 1.02, Math.PI * 1.98); g.fillStyle = o.hair; g.fill();
    ell(sx - 10, hy - 2, 4, 7, o.hair);
    const blink = (t + o.ph) % 4.5 < .15, ey = hy + 1 + (o.lookDown ? 2 : 0);
    if (blink) { line([sx - 6, ey], [sx - 2, ey], '#2a1a14', 1.5); line([sx + 2, ey], [sx + 6, ey], '#2a1a14', 1.5); }
    else { ell(sx - 4, ey, 1.8, 2.2, '#2a1a14'); ell(sx + 4, ey, 1.8, 2.2, '#2a1a14'); }
    g.globalAlpha = .45; ell(sx - 7, hy + 5, 3, 2, '#e8776a'); ell(sx + 7, hy + 5, 3, 2, '#e8776a'); g.globalAlpha = 1;
    if (o.glasses) { g.strokeStyle = '#3a2418'; g.lineWidth = 1.2; g.beginPath(); g.arc(sx - 4, ey, 3.5, 0, 7); g.moveTo(sx + 7.5, ey); g.arc(sx + 4, ey, 3.5, 0, 7); g.stroke(); }
  }
  return [sx, hy];
}

function bubble(x, y, t, emoji, ph = 0) {
  const fy = y + Math.sin(t * 1.4 + ph) * 3;
  g.globalAlpha = .95;
  ell(x - 8, fy + 26, 3, 3, '#fff4e2'); ell(x - 3, fy + 20, 4.5, 4.5, '#fff4e2');
  rrect(x - 20, fy - 22, 40, 36, 14, '#fff4e2');
  g.globalAlpha = 1;
  g.font = '20px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(emoji, x, fy - 3);
}

function cat(t) {
  const [cx, cy] = P(1.3, 2.7, 0);
  g.globalAlpha = .2; ell(cx, cy + 2, 20, 6, '#2a140a'); g.globalAlpha = 1;
  ell(cx - 14, cy - 2, 9, 4, '#e0913f');
  ell(cx, cy - 7 + Math.sin(t * 1.5) * .8, 16, 10, '#e0913f');
  ell(cx + 13, cy - 11, 8, 7, '#e0913f');
  poly([[cx + 7, cy - 15], [cx + 9, cy - 22], [cx + 12, cy - 16]], '#e0913f'); poly([[cx + 14, cy - 16], [cx + 18, cy - 22], [cx + 19, cy - 14]], '#e0913f');
  line([cx - 4, cy - 15], [cx - 2, cy - 2], '#b86e2a', 2); line([cx + 2, cy - 16], [cx + 3, cy - 2], '#b86e2a', 2);
  line([cx + 10, cy - 11], [cx + 13, cy - 11], '#3a2418', 1.5); line([cx + 15, cy - 11], [cx + 18, cy - 11], '#3a2418', 1.5);
  for (let k = 0; k < 2; k++) {
    const pr = (t * .3 + k / 2) % 1; g.globalAlpha = 1 - pr;
    g.font = `${11 + k * 3}px Georgia`; g.fillStyle = '#f3d9b1'; g.fillText('z', cx + 24 + k * 8, cy - 26 - pr * 26);
  }
  g.globalAlpha = 1;
}

function sofaAndDad(t) {
  box(2.95, 2.5, 0, .2, 2.2, 32, '#6b774a', '#5d6840', '#5d6840');   // far arm
  box(3.0, 2.7, 0, .85, 1.8, 20, '#86965f', '#6b774a', '#5d6840');
  const [dx, dy] = person(3.4, 3.55, 20, { pose: 'sit', back: true, hair: '#2e1d14', skin: '#c48a65', shirt: '#9a4a3a', pants: '#3a3f55', ph: 2.1 }, t);
  box(3.6, 2.7, 20, .3, 1.8, 30, '#7d8a58', '#6b774a', '#5d6840');
  box(2.95, 4.5, 0, .9, .2, 32, '#7d8a58', '#6b774a', '#5d6840');    // near arm
  [3.0, 3.6].forEach(y => { const [cx, cy] = P(3.65, y + .3, 50); rrect(cx - 12, cy - 18, 24, 20, 7, y < 3.5 ? '#c9763f' : '#e6c48a'); });
  bubble(dx + 34, dy - 44, t, '☕', 1);
}

function table(t) {
  const [tx, ty] = P(5.2, 4.2, 0);
  g.globalAlpha = .2; ell(tx, ty, 40, 18, '#2a140a'); g.globalAlpha = 1;
  rrect(tx - 4, ty - 44, 8, 44, 2, '#4a2e1e');
  box(4.85, 3.1, 0, .7, .6, 26, '#7a4a2c', '#5e371f', '#4a2e1e'); // far chair
  box(4.85, 3.1, 26, .7, .12, 34, '#7a4a2c', '#5e371f', '#4a2e1e');
  ell(tx, ty - 46, 62, 31, '#5e371f'); ell(tx, ty - 48, 62, 31, '#8a5634');
  ell(tx - 10, ty - 50, 14, 6, '#efe2c4'); ell(tx - 10, ty - 51, 10, 4, '#c9763f');
  ell(tx + 22, ty - 46, 12, 5, '#efe2c4'); rrect(tx + 30, ty - 62, 8, 14, 3, '#b5543f');
  rrect(tx - 34, ty - 66, 8, 18, 2, '#efe2c4'); ell(tx - 30, ty - 69 + Math.sin(t * 9) * .5, 2.5, 4, '#ffcf6b');
  // grandpa eating on near chair
  box(5.0, 5.0, 0, .65, .65, 24, '#7a4a2c', '#5e371f', '#4a2e1e');
  const [gx, gy] = person(5.3, 5.25, 24, { pose: 'sit', back: true, hair: '#d9d2c5', skin: '#d8a07a', shirt: '#6a7f8e', pants: '#3e3a3a', ph: 1.3, armAnim: t => Math.sin(t * 1.6) > 0 ? -10 : 0 }, t);
  box(5.0, 5.55, 24, .65, .12, 36, '#7a4a2c', '#5e371f', '#4a2e1e');
  bubble(gx + 34, gy - 40, t, '🍲', 2);
}

function lamp() {
  const [lx, ly] = P(4.25, 5.1, 0);
  ell(lx, ly, 12, 5, '#3a2418'); g.fillStyle = '#3a2418'; g.fillRect(lx - 1.5, ly - 120, 3, 120);
  poly([[lx - 16, ly - 112], [lx + 16, ly - 112], [lx + 10, ly - 138], [lx - 10, ly - 138]], '#ecc27a');
}

function lighting(t) {
  const fl = .85 + Math.sin(t * 11) * .08 + Math.sin(t * 5.3) * .07;
  g.globalCompositeOperation = 'multiply';
  g.fillStyle = 'rgba(150,120,160,1)'; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'lighter';
  const glow = (x, y, r, col, a) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.fillRect(0, 0, W, H); };
  const [fx, fy] = P(.7, 3.45, 20); glow(fx, fy, 330, '255,130,50', .42 * fl);
  const [lx, ly] = P(4.25, 5.1, 120); glow(lx, ly, 200, '255,190,110', .3);
  const [wx, wy] = P(2.2, .3, 90); glow(wx, wy, 220, '255,160,110', .22);
  const [sx, sy] = P(5.45, .4, 50); glow(sx, sy, 120, '255,170,90', .15);
  g.globalCompositeOperation = 'source-over';
}

function frame(ms) {
  const t = ms / 1000;
  background(t);
  for (const l of outsideLeaves) if (l.z < .5) { l.y = (l.y + .2 * l.s / 15) % H; leaf((l.x + Math.sin(t + l.ph) * 20 + W) % W, l.y, t + l.ph, l.c, .7); }
  floorAndWalls(); windowView(t); stringLights(t); kitchen(t); fireplace(t); bookshelf(); rug(); cat(t);
  // kid reading on the rug
  const [kx, ky] = person(1.9, 3.9, 0, { pose: 'floor', hair: '#7a4a2a', skin: '#f0c4a0', shirt: '#e8c25a', pants: '#5a7a8a', ph: 3.3, lookDown: true }, t);
  rrect(kx - 13, ky + 20, 26, 18, 2, '#3f6a6a'); line([kx, ky + 20], [kx, ky + 38], '#efe2c4', 2);
  bubble(kx - 34, ky - 40, t, '📖', 3);
  // mum stirring at stove
  const [mx, my] = person(5.45, 1.25, 0, { pose: 'stand', back: true, bun: true, apron: false, hair: '#4a2a1a', skin: '#e9b48f', shirt: '#c9763f', pants: '#5a4a6a', ph: 0, armAnim: t => Math.sin(t * 3) * 4 }, t);
  bubble(mx - 36, my - 40, t, '🥧', 4);
  sofaAndDad(t); lamp(); table(t);
  lighting(t);
  for (const l of outsideLeaves) if (l.z >= .5) { l.y = (l.y + .25 * l.s / 15); if (l.y > H) l.y = -10; leaf((l.x + Math.sin(t + l.ph) * 20 + W) % W, l.y, t + l.ph, l.c, 1); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
