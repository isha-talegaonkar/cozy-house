<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Style 1 · Pixel Art</title>
<style>
  body { margin: 0; background: #1a1210; color: #f3d9b1; font-family: Georgia, serif;
         display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
  h1 { font-weight: normal; letter-spacing: 1px; margin: 16px 0 10px; }
  canvas { image-rendering: pixelated; width: min(94vw, 960px); aspect-ratio: 192 / 120;
           border-radius: 10px; box-shadow: 0 0 80px #ff8a3d30; }
  p { max-width: 720px; text-align: center; opacity: .8; line-height: 1.5; }
</style>
</head>
<body>
<h1>Style 1 · Pixel Art</h1>
<canvas id="c" width="192" height="120"></canvas>
<p>Chunky retro pixels like Stardew Valley. Simplest to build and very charming, but it's a flat side view rather than a Sims-style dollhouse.</p>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const W = 192, H = 120;
const p = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

const WX = 14, WY = 16, WW = 38, WH = 36; // window
const leafCols = ['#e07b39', '#c9512c', '#f0a640', '#a8432a'];
const leaves = Array.from({ length: 16 }, (_, i) => ({ x: WX + Math.random() * WW, y: Math.random() * WH, s: .5 + Math.random(), ph: Math.random() * 6, c: leafCols[i % 4] }));

function ellipse(cx, cy, rx, ry, col) {
  for (let dy = -ry; dy <= ry; dy++) {
    const w = Math.round(rx * Math.sqrt(1 - (dy / ry) ** 2));
    p(cx - w, cy + dy, w * 2, 1, col);
  }
}

function room() {
  // wall + wallpaper stripes + wainscot
  p(0, 0, W, 84, '#6e4636');
  for (let i = 4; i < W; i += 8) p(i, 0, 1, 66, '#633e30');
  p(0, 66, W, 18, '#5a3626'); p(0, 66, W, 1, '#7d4f37');
  for (let i = 6; i < W; i += 16) p(i, 69, 10, 11, '#523121');
  p(0, 82, W, 2, '#3e2619');
  // floor planks
  p(0, 84, W, 36, '#7a4a2c');
  for (let r = 0; r < 6; r++) {
    p(0, 84 + r * 6, W, 1, '#62391f');
    for (let s = (r % 2) * 20; s < W; s += 40) p(s, 85 + r * 6, 1, 5, '#62391f');
  }
}

function windowView(t) {
  const bands = ['#5d4a7c', '#8e577a', '#c96a68', '#e88b5e', '#f4ad6c', '#f8c67f'];
  bands.forEach((b, i) => p(WX, WY + i * 6, WW, 6, b));
  p(WX + 26, WY + 22, 6, 5, '#ffe2a0');           // sun
  p(WX, WY + 28, WW, 8, '#6b3d2e'); p(WX + 18, WY + 26, 20, 2, '#6b3d2e');
  p(WX + 8, WY + 17, 3, 13, '#3b2418');           // tree
  p(WX + 2, WY + 7, 16, 11, '#c9512c'); p(WX + 4, WY + 4, 12, 4, '#e07b39');
  p(WX, WY + 11, 4, 5, '#a8432a'); p(WX + 15, WY + 9, 5, 6, '#e07b39');
  p(WX + 6, WY + 6, 3, 2, '#f0a640'); p(WX + 11, WY + 11, 2, 2, '#f0a640');
  g.save(); g.beginPath(); g.rect(WX, WY, WW, WH); g.clip();
  for (const l of leaves) {
    const ly = WY + ((l.y + t * l.s * 6) % WH), lx = l.x + Math.sin(t * 1.4 + l.ph) * 2.5 + t * .6 % WW;
    p(WX + ((lx - WX) % WW + WW) % WW, ly, 1, 1, l.c);
  }
  g.restore();
  const f = '#3a2418';
  p(WX - 2, WY - 2, WW + 4, 2, f); p(WX - 2, WY, 2, WH, f); p(WX + WW, WY, 2, WH, f);
  p(WX + WW / 2 - 1, WY, 2, WH, f); p(WX, WY + WH / 2 - 1, WW, 2, f);
  p(WX - 3, WY + WH, WW + 6, 3, '#4a2e1e');
  // curtains
  p(WX - 7, WY - 4, 6, WH + 6, '#8e3b2f'); p(WX + WW + 1, WY - 4, 6, WH + 6, '#8e3b2f');
  p(WX - 5, WY - 4, 1, WH + 6, '#7a3127'); p(WX + WW + 3, WY - 4, 1, WH + 6, '#7a3127');
  p(WX - 9, WY - 5, WW + 18, 2, '#3a2418');
}

function stringLights(t) {
  for (let i = 0; i < W; i++) p(i, 3 + Math.round(Math.sin((i % 32) / 32 * Math.PI) * 3), 1, 1, '#2a1a14');
  const cols = ['#ffcf6b', '#ff8f5a', '#ffe9a8', '#f7a35c'];
  for (let i = 8, k = 0; i < W; i += 16, k++) {
    const on = Math.sin(t * 1.2 + k) > -0.6;
    p(i, 4 + Math.round(Math.sin((i % 32) / 32 * Math.PI) * 3), 2, 2, on ? cols[k % 4] : '#7a5a3a');
  }
}

function frames() {
  p(66, 18, 16, 12, '#3e2619'); p(67, 19, 14, 10, '#e6b77a'); p(67, 25, 14, 4, '#7d8a58'); p(75, 21, 3, 3, '#fff1c8');
  p(86, 22, 10, 12, '#3e2619'); p(87, 23, 8, 10, '#b5543f'); p(89, 25, 4, 4, '#f3d9b1');
}

function stove(t) {
  p(56, 40, 28, 2, '#4a2e1e');                          // shelf
  p(58, 33, 4, 7, '#c9a36b'); p(64, 35, 4, 5, '#8e3b2f'); p(70, 32, 5, 8, '#7d8a58'); p(77, 34, 4, 6, '#e6c48a');
  p(58, 70, 22, 14, '#2f2a28'); p(57, 68, 24, 3, '#4a4441');
  p(61, 73, 16, 9, '#3b3532'); p(63, 75, 12, 4, '#a85a2a');
  p(62, 63, 11, 5, '#8a8f94'); p(61, 62, 13, 1, '#b8bcc0'); p(66, 61, 3, 1, '#b8bcc0');
  for (let k = 0; k < 3; k++) {
    const prog = ((t * .6 + k / 3) % 1);
    g.globalAlpha = .7 * (1 - prog);
    p(66 + Math.sin(t * 2 + k * 2) * 2, 59 - prog * 16, 2, 2, '#eadfcf');
    g.globalAlpha = 1;
  }
}

function lamp() {
  p(100, 48, 1, 36, '#3e2619'); p(97, 83, 7, 1, '#3e2619');
  p(95, 41, 11, 2, '#f2c97c'); p(94, 43, 13, 5, '#e8b86a');
}

function fireplace(t) {
  p(132, 34, 44, 50, '#7d746c');
  for (let r = 0; r < 10; r++) { p(132, 38 + r * 5, 44, 1, '#6a625b'); for (let s = (r % 2) * 5 + 132; s < 176; s += 10) p(s, 38 + r * 5, 1, 5, '#6a625b'); }
  p(142, 56, 24, 28, '#1a1010'); p(144, 54, 20, 2, '#1a1010');
  p(128, 31, 52, 4, '#4a2e1e'); p(128, 35, 52, 1, '#3a2418');
  // mantel decor
  const fl = Math.sin(t * 9) > 0 ? '#ffd05a' : '#ffb347';
  p(134, 25, 2, 6, '#efe2c4'); p(134, 23, 2, 2, fl);
  p(139, 27, 2, 4, '#efe2c4'); p(139, 25, 2, 2, fl);
  p(150, 24, 8, 7, '#5a3626'); p(151, 25, 6, 5, '#efe2c4'); p(154, 26, 1, 2, '#3a2418');
  p(167, 26, 6, 5, '#b5543f'); p(166, 22, 3, 4, '#7d8a58'); p(170, 21, 3, 5, '#86965f');
  // fire
  p(146, 80, 16, 3, '#4a2e1e'); p(148, 79, 12, 2, '#5e3a24');
  for (let i = 0; i < 14; i++) {
    const h = Math.max(2, Math.round(3 + Math.sin(i / 13 * Math.PI) * 8 + Math.sin(t * 9 + i * 1.7) * 2 + Math.sin(t * 13 + i * .7) * 1.5));
    p(147 + i, 79 - h, 1, h, '#c2401f');
    p(147 + i, 79 - h * .7, 1, h * .7, '#f07b2a');
    p(147 + i, 79 - h * .35, 1, h * .35, '#ffd05a');
  }
  for (let k = 0; k < 3; k++) { const pr = (t * .8 + k / 3) % 1; p(150 + k * 4 + Math.sin(t * 3 + k) * 2, 70 - pr * 14, 1, 1, pr < .7 ? '#ffb347' : '#a85a2a'); }
}

function person(fx, fy, o, t) {
  const b = Math.sin(t * 2 + (o.ph || 0)) > .3 ? -1 : 0;   // breathing
  let top;
  if (o.pose === 'stand') {
    p(fx - 3, fy - 7, 2, 7, o.pants); p(fx + 1, fy - 7, 2, 7, o.pants);
    p(fx - 3, fy - 1, 2, 1, '#2a1a14'); p(fx + 1, fy - 1, 2, 1, '#2a1a14');
    top = fy - 7;
  } else if (o.pose === 'floor') {
    p(fx - 6, fy - 3, 12, 3, o.pants); top = fy - 3;
  } else {
    p(fx - 4, fy - 3, 8, 3, o.pants); p(fx - 3, fy, 2, 3, o.pants); p(fx + 1, fy, 2, 3, o.pants); top = fy - 3;
  }
  p(fx - 4, top - 9 + b, 8, 9, o.shirt);
  p(fx - 5, top - 8 + b, 1, 6, o.shirt); p(fx + 4, top - 8 + b, 1, 6, o.shirt);
  p(fx - 3, top - 15 + b, 6, 6, o.skin);
  if (o.back) { p(fx - 3, top - 16 + b, 6, 7, o.hair); if (o.bun) p(fx - 1, top - 18 + b, 3, 2, o.hair); }
  else {
    p(fx - 3, top - 16 + b, 6, 2, o.hair); p(fx - 3, top - 14 + b, 1, 3, o.hair); p(fx + 2, top - 14 + b, 1, 2, o.hair);
    const blink = (t + (o.ph || 0)) % 4 < .15;
    const ey = top - 12 + b + (o.lookDown ? 1 : 0);
    if (blink) { p(fx - 2, ey, 1, 1, o.skin); }
    else { p(fx - 2, ey, 1, 1, '#2a1a14'); p(fx + 1, ey, 1, 1, '#2a1a14'); }
    p(fx - 3, top - 11 + b, 1, 1, '#e8977a'); p(fx + 2, top - 11 + b, 1, 1, '#e8977a');
  }
  return top + b;
}

function bubble(x, y, t, draw) {
  const fy = y + Math.round(Math.sin(t * 1.5) );
  p(x - 6, fy - 7, 12, 8, '#fff4e2'); p(x - 5, fy - 8, 10, 1, '#fff4e2'); p(x - 5, fy + 1, 10, 1, '#fff4e2');
  p(x - 2, fy + 3, 2, 2, '#fff4e2'); p(x - 4, fy + 6, 1, 1, '#fff4e2');
  draw(x, fy - 4);
}

function zzz(x, y, t) {
  for (let k = 0; k < 2; k++) {
    const pr = (t * .35 + k / 2) % 1, zx = x + k * 3 + Math.sin(t + k) , zy = y - pr * 10;
    g.globalAlpha = 1 - pr;
    p(zx, zy, 3, 1, '#f3d9b1'); p(zx + 1, zy + 1, 1, 1, '#f3d9b1'); p(zx, zy + 2, 3, 1, '#f3d9b1');
    g.globalAlpha = 1;
  }
}

function scene(t) {
  room(); stringLights(t); windowView(t); frames(); stove(t); lamp(); fireplace(t);
  // rug
  ellipse(150, 101, 32, 8, '#8e3b2f'); ellipse(150, 101, 28, 6, '#b5543f'); ellipse(150, 101, 25, 5, '#8e3b2f');
  for (let i = -20; i <= 20; i += 8) p(150 + i, 101, 3, 1, '#e6b77a');

  // mom stirring the pot (back view)
  const momTop = person(69, 93, { pose: 'stand', back: true, bun: true, hair: '#4a2a1a', skin: '#e9b48f', shirt: '#c9763f', pants: '#5a4a6a', ph: 0 }, t);
  p(73 + Math.round(Math.sin(t * 3)), momTop - 8, 2, 2, '#e9b48f');
  p(60, momTop - 6, 18, 1, '#f3e6cf'); // apron tie

  // grandpa eating soup behind table
  const gTop = person(92, 88, { pose: 'sit', hair: '#d9d2c5', skin: '#d8a07a', shirt: '#6a7f8e', pants: '#3e3a3a', ph: 1.3 }, t);
  const spoon = Math.sin(t * 1.6) > 0;
  p(spoon ? 93 : 95, spoon ? gTop - 5 : gTop - 1, 1, 3, '#b8bcc0');
  p(82, 82, 22, 2, '#5e371f'); p(84, 84, 2, 10, '#4a2e1e'); p(100, 84, 2, 10, '#4a2e1e');
  p(88, 79, 8, 3, '#e6d6bd'); p(89, 79, 6, 1, '#c9763f');
  p(98, 79, 3, 3, '#8e3b2f');

  // dad in armchair with tea
  p(109, 62, 22, 16, '#6c7c4e'); p(111, 64, 18, 12, '#7a8a5a');
  const dTop = person(120, 84, { pose: 'sit', hair: '#2e1d14', skin: '#c48a65', shirt: '#9a4a3a', pants: '#3a3f55', ph: 2.1 }, t);
  p(123, dTop - 6, 3, 3, '#efe2c4'); p(126, dTop - 5, 1, 1, '#efe2c4');
  const sp = (t * .5) % 1; g.globalAlpha = .6 * (1 - sp); p(124, dTop - 8 - sp * 6, 1, 1, '#eadfcf'); g.globalAlpha = 1;
  p(106, 70, 5, 16, '#5d6c42'); p(129, 70, 5, 16, '#5d6c42');
  p(112, 82, 16, 4, '#86965f'); p(108, 86, 2, 3, '#3a2418'); p(130, 86, 2, 3, '#3a2418');

  // kid reading on the rug
  const kTop = person(150, 102, { pose: 'floor', hair: '#7a4a2a', skin: '#f0c4a0', shirt: '#e8c25a', pants: '#5a7a8a', ph: 3.3, lookDown: true }, t);
  p(147, kTop - 6, 7, 5, '#3f6a6a'); p(150, kTop - 6, 1, 5, '#efe2c4');
  if ((t % 6) < .4) p(148, kTop - 6, 2, 4, '#efe2c4'); // page turn

  // cat napping
  p(170, 96, 10, 4, '#e0913f'); p(178, 94, 5, 4, '#e0913f'); p(178, 93, 1, 1, '#e0913f'); p(182, 93, 1, 1, '#e0913f');
  p(167, 98, 4, 2, '#e0913f'); p(173, 96, 1, 4, '#b86e2a'); p(176, 96, 1, 4, '#b86e2a');
  p(179, 96, 1, 1, '#3a2418'); p(181, 96, 1, 1, '#3a2418');
  zzz(181, 90, t);

  bubble(92, gTop - 20, t, (x, y) => { p(x - 3, y, 6, 2, '#c9763f'); p(x - 3, y + 2, 6, 1, '#efe2c4'); p(x - 1, y - 2, 1, 1, '#eadfcf'); p(x + 1, y - 3, 1, 1, '#eadfcf'); });

  // lighting
  const fl = .85 + Math.sin(t * 11) * .08 + Math.sin(t * 5.3) * .07;
  g.globalCompositeOperation = 'lighter';
  let gr = g.createRadialGradient(154, 72, 2, 154, 72, 60);
  gr.addColorStop(0, `rgba(255,140,60,${.35 * fl})`); gr.addColorStop(1, 'rgba(255,140,60,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  gr = g.createRadialGradient(100, 46, 1, 100, 46, 34);
  gr.addColorStop(0, 'rgba(255,200,120,.28)'); gr.addColorStop(1, 'rgba(255,200,120,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  gr = g.createRadialGradient(33, 34, 2, 33, 34, 40);
  gr.addColorStop(0, 'rgba(255,170,110,.18)'); gr.addColorStop(1, 'rgba(255,170,110,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'multiply';
  gr = g.createRadialGradient(110, 70, 30, 110, 70, 130);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#6a4a5a');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'source-over';
}

function loop(ms) { scene(ms / 1000); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
